<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<title>AICP Research</title>
<style>
  /* Arabische Leseschriften (SIL OFL 1.1, siehe app/ui/fonts/OFL-*.txt).
     Mitgeliefert und über /fonts/ ausgeliefert – offline, gleich auf jedem
     System. Es wird nur die tatsächlich gewählte Schrift geladen. */
  /* unicode-range begrenzt jede arabische Schrift auf arabische Zeichen. Dadurch fallen
     lateinische Buchstaben/Ziffern (auch im Arabisch-Modus) auf --sans zurück – dieselbe
     Schrift wie im Deutschen, statt in die Serifen von Amiri zu rutschen. */
  @font-face{font-family:"Scheherazade New";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/ScheherazadeNew-Regular.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFF;}
  @font-face{font-family:"Scheherazade New";font-style:normal;font-weight:700;font-display:swap;src:url("/fonts/ScheherazadeNew-Bold.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFF;}
  @font-face{font-family:"Amiri";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/Amiri-Regular.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFF;}
  @font-face{font-family:"Amiri";font-style:normal;font-weight:700;font-display:swap;src:url("/fonts/Amiri-Bold.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFF;}
  @font-face{font-family:"Noto Naskh Arabic";font-style:normal;font-weight:100 900;font-display:swap;src:url("/fonts/NotoNaskhArabic.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFF;}
  @font-face{font-family:"Noto Sans Arabic";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/NotoSansArabic-Regular.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFF;}
  @font-face{font-family:"Noto Sans Arabic";font-style:normal;font-weight:700;font-display:swap;src:url("/fonts/NotoSansArabic-Bold.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFF;}
  :root {
    --bg: #ffffff;
    --surface: #f7f8f8;
    --panel: #ffffff;
    --ink: #17201c;
    --muted: #737d78;
    --faint: #9aa39e;
    --line: #e8eae8;
    --line-strong: #d9dcd9;
    --accent: #12795a;
    --accent-weak: #eef5f1;
    --accent-ink: #0c5c44;
    /* Kräftige, gut lesbare Chip-/Badge-Farben (statt blasser Pastelltöne) */
    --chip-bg: #d4ebe0;
    --chip-ink: #0f6b4f;
    --hl: #f0a800;          /* sattes Amber für Suchtreffer (kräftiger, gut lesbar) */
    --hl-ink: #2e2200;      /* dunkler Text auf der Markierung */
    --err: #b23a2e;
    --err-bg: #f7d7d1;
    --err-ink: #8f2c20;
    --warn: #9a6a12;
    --warn-bg: #f5e2b8;
    --warn-ink: #7a5200;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,30,25,.04), 0 8px 24px rgba(20,30,25,.06);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    /* Oberflächen-Schrift (Menü, Titel, Trefferliste): klare, gut lesbare
       serifenlose Schrift – wirkt größer/ruhiger als Naskh bei UI-Größen. */
    --arab: "Noto Sans Arabic", "Noto Naskh Arabic", "Amiri", var(--sans);
    /* Lese-Schrift NUR für den Dokumenttext im Leser (im Panel wählbar). */
    --rArab: "Scheherazade New", "Noto Naskh Arabic", "Amiri", var(--sans);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  :lang(ar), [dir="rtl"] { font-family: var(--arab); }
  button { font-family: inherit; }
  ::selection { background: var(--accent-weak); }

  svg.ic { width: 18px; height: 18px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    flex: none; }

  #app { display: grid; grid-template-columns: 244px 1fr; height: 100vh; }

  /* ---------- Sidebar ---------- */
  nav {
    background: var(--surface); border-inline-end: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 16px 12px;
    min-height: 0; overflow-y: auto;
  }
  .brand {
    display: flex; align-items: center; gap: 9px; padding: 6px 10px 18px;
    font-weight: 650; font-size: 16px; letter-spacing: -.01em;
    color: var(--ink);
  }
  .brand .dot { width: 22px; height: 22px; border-radius: 7px;
    background: var(--accent); display: grid; place-items: center; }
  .brand .dot svg { stroke: #fff; width: 14px; height: 14px; }
  .navItem {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 11px; border: 0; background: none; cursor: pointer;
    color: #2a332e; border-radius: 8px; font-size: 14.5px; font-weight: 500;
    text-align: start; margin-bottom: 2px; transition: background .12s, color .12s;
  }
  .navItem svg { stroke: var(--muted); }
  .navItem:hover { background: rgba(18,121,90,.06); color: var(--ink); }
  .navItem:hover svg { stroke: var(--ink); }
  .navItem.active { background: var(--accent-weak); color: var(--accent-ink);
    font-weight: 600; }
  .navItem.active svg { stroke: var(--accent); }
  .navSpacer { flex: 1; }
  .navSection { border-top: 1px solid var(--line); margin-top: 8px;
    padding-top: 8px; }
  .navItem.subtle { color: #3a423d; font-size: 13.5px; padding: 8px 11px;
    font-weight: 500; }
  .navItem.updateItem { color: var(--accent-ink); background: var(--accent-weak);
    font-weight: 600; font-size: 13.5px; }
  .navItem.updateItem svg { stroke: var(--accent); }
  .navItem.updateItem:hover { background: #dfeee7; }
  #navStatus { font-size: 12px; color: var(--faint); padding: 6px 11px 2px;
    line-height: 1.5; display: flex; align-items: center; gap: 7px; }
  #navStatus .pulse { width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex: none; }
  #navStatus.off .pulse { background: var(--faint); }
  /* ---------- Sammlungen (Seitenleiste + Index-Seiten) ---------- */
  .navCollections { border-top: 1px solid var(--line); margin-top: 8px;
    padding-top: 10px; }
  .navSecLabel { font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint); padding: 0 11px 6px; }
  /* Index-Seite: Kopf mit Suchfeld + „verwalten"-Button */
  .indexHead { max-width: 900px; margin: 0 auto 18px; display: flex;
    align-items: center; gap: 12px; flex-wrap: wrap; }
  .indexHead h1.title { margin: 0; flex: none; }
  .indexSearch { flex: 1; min-width: 200px; position: relative; }
  .indexSearch input { width: 100%; padding: 10px 14px 10px 40px;
    border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px;
    font-family: inherit; background: var(--panel); color: var(--ink); }
  .indexSearch input:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak); }
  .indexSearch .si { position: absolute; inset-inline-start: 12px; top: 50%;
    transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint);
    pointer-events: none; }
  /* Liste der Autoren/Kategorien */
  .indexList { max-width: 900px; margin: 0 auto; border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .indexItem { display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 18px; border: 0; border-bottom: 1px solid var(--line);
    background: none; cursor: pointer; text-align: start;
    transition: background .12s; }
  .indexItem:last-child { border-bottom: 0; }
  .indexItem:hover { background: var(--surface); }
  .indexItem .in { font-weight: 600; font-size: 15px; color: var(--ink);
    font-family: var(--arab); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .indexItem .ic-count { margin-inline-start: auto; flex: none; font-size: 12.5px;
    font-weight: 600; color: var(--chip-ink); background: var(--chip-bg);
    padding: 3px 10px; border-radius: 999px; }
  .indexItem .chev { flex: none; width: 17px; height: 17px; color: var(--faint); }
  /* Buchlisten-Kopf (Sammlung eines Autors/einer Kategorie) */
  .collKind { font-size: 12px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--accent-ink); margin-bottom: 2px; }
  .backBtn { display: inline-flex; align-items: center; gap: 6px; border: 0;
    background: none; cursor: pointer; color: var(--muted); font-size: 13px;
    font-family: inherit; padding: 4px 0; margin-bottom: 6px; }
  .backBtn:hover { color: var(--accent-ink); }
  .backBtn svg { width: 16px; height: 16px; }

  /* ---------- Content ---------- */
  section.view { display: none; height: 100vh; overflow-y: auto;
    padding: 34px 40px 60px; }
  section.view.active { display: block; }
  .viewHead { max-width: 900px; margin: 0 auto 20px; }
  .viewInner { max-width: 900px; margin: 0 auto; }
  h1.title { font-size: 21px; font-weight: 650; letter-spacing: -.02em;
    margin: 0 0 3px; }
  .subtitle { color: var(--muted); font-size: 14px; }

  /* ---------- Search ---------- */
  .segmented { display: inline-flex; background: var(--surface);
    border: 1px solid var(--line); border-radius: 9px; padding: 3px;
    gap: 2px; margin-bottom: 16px; }
  .segmented button { border: 0; background: none; cursor: pointer;
    padding: 6px 15px; border-radius: 7px; font-size: 13.5px;
    color: var(--muted); font-weight: 500; }
  .segmented button.active { background: var(--panel); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.06); font-weight: 600; }

  .searchBar { display: flex; gap: 10px; align-items: stretch; }
  .inputWrap { flex: 1; display: flex; align-items: center; gap: 9px;
    background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: var(--radius); padding: 0 14px; transition: border-color .12s, box-shadow .12s; }
  .inputWrap:focus-within { border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak); }
  .inputWrap svg { stroke: var(--faint); }
  .inputWrap input { flex: 1; border: 0; outline: none; background: none;
    font-family: inherit; font-size: 15.5px; padding: 12px 0; color: var(--ink); }
  .btn { border: 1px solid var(--line-strong); background: var(--panel);
    color: var(--ink); border-radius: var(--radius); padding: 9px 16px;
    font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex;
    align-items: center; gap: 7px; transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn:disabled, .iconBtn:disabled { opacity: .55; cursor: default; }
  /* kleiner Akzent-Spinner im Icon-Knopf (statt weiß-auf-weiß) */
  .iconBtn .ring.mini { width: 16px; height: 16px; border-width: 2px; }
  .btn.ghost { border-color: transparent; background: none; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface); color: var(--ink); }
  .btn.danger { border-color: #e6c3bd; color: var(--err); }
  .btn.danger:hover { background: #fbeae7; border-color: #dcaea6; }

  .filters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  .filters select { padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line-strong); font-family: inherit;
    background: var(--panel); color: var(--ink); max-width: 220px; }
  .authorFilter { position: relative; display: inline-flex; flex-wrap: wrap;
    align-items: center; gap: 6px; min-width: 220px; max-width: 380px;
    padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--panel); cursor: text; }
  .authorFilter:focus-within { border-color: var(--accent); }
  /* Hochwertiges Auswahl-Dropdown (statt nativem <datalist>) */
  .comboPanel { position: absolute; top: calc(100% + 5px); inset-inline-start: 0;
    min-width: 220px; max-width: 340px; max-height: 260px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 11px; box-shadow: var(--shadow); z-index: 45; padding: 5px;
    display: none; }
  .comboPanel.show { display: block; }
  .comboOpt { padding: 8px 11px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; font-family: var(--arab); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comboOpt:hover, .comboOpt.active { background: var(--accent-weak);
    color: var(--accent-ink); }
  .comboEmpty { padding: 9px 11px; font-size: 13px; color: var(--faint); }
  .authorFilter input { border: 0; outline: none; background: none; flex: 1;
    min-width: 90px; font-family: inherit; font-size: 13.5px; color: var(--ink);
    padding: 3px 2px; }
  .authorFilter .chip { font-size: 12px; padding: 3px 5px 3px 10px; }
  .switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .switch input { accent-color: var(--accent); }
  .chip { display: inline-flex; align-items: center; gap: 7px;
    background: var(--chip-bg); color: var(--chip-ink); font-weight: 600;
    padding: 4px 6px 4px 12px; border-radius: 999px; font-size: 12.5px; }
  .chip button { border: 0; background: none; cursor: pointer; color: inherit;
    display: grid; place-items: center; padding: 2px; border-radius: 50%; }
  .chip button:hover { background: rgba(12,92,68,.12); }
  .overlay { position: fixed; inset: 0; background: rgba(20,30,25,.28);
    display: none; align-items: center; justify-content: center; z-index: 60; }
  .overlay.show { display: flex; }
  .modal { width: min(460px, 92vw); background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 20px; }
  .modalHead { display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 650; margin-bottom: 16px; }
  .mfLabel { display: block; font-size: 12.5px; color: var(--muted);
    font-weight: 600; margin: 14px 0 6px; }
  .mfInput { width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong);
    border-radius: 9px; font-size: 14px; font-family: inherit; background: var(--bg);
    color: var(--ink); }
  .mfInput:focus { outline: none; border-color: var(--accent); }
  .chipField { position: relative; display: flex; flex-wrap: wrap; gap: 7px;
    align-items: center; padding: 7px; border: 1px solid var(--line-strong);
    border-radius: 9px; min-height: 42px; background: var(--bg); cursor: text; }
  .chipField:focus-within { border-color: var(--accent); }
  .chipField input { border: 0; outline: none; background: none; flex: 1;
    min-width: 120px; font-size: 14px; font-family: inherit; color: var(--ink);
    padding: 4px 2px; }
  .modalFoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  /* Verwalten-Popup (Kategorien / Autoren) – hochwertige Variante */
  .modal.modalLg { width: min(560px, 94vw); padding: 24px 24px 20px; }
  .modalLg .modalHead { align-items: flex-start; margin-bottom: 18px; }
  .mhTitle { display: flex; align-items: center; gap: 13px; }
  .mhIcon { width: 40px; height: 40px; border-radius: 11px; flex: none;
    background: var(--accent-weak); display: grid; place-items: center; }
  .mhIcon svg { width: 21px; height: 21px; stroke: var(--accent); }
  .mhTitle > span:last-child { display: flex; flex-direction: column; }
  #manageHead { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .mhSub { font-size: 12.5px; color: var(--muted); font-weight: 400;
    margin-top: 2px; }
  .manageNewRow { display: flex; gap: 8px; align-items: stretch; margin: 4px 0 18px;
    padding: 12px; background: var(--surface); border-radius: 11px; }
  .manageNewRow .mfInput { flex: 1; background: var(--panel); }
  .manageNewRow .btn { flex: none; padding: 0 20px; }
  .manageList { max-height: 50vh; overflow-y: auto; display: flex;
    flex-direction: column; gap: 8px; padding-right: 2px; }
  .catRow { display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--panel);
    transition: border-color .12s, box-shadow .12s; }
  .catRow:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .catRow .cname { font-weight: 600; font-size: 14.5px; font-family: var(--arab);
    color: var(--ink); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; min-width: 0; }
  .catRow .cname input { width: 100%; }
  .catRow .ccount { font-size: 12px; font-weight: 600; color: var(--chip-ink);
    background: var(--chip-bg); padding: 2px 9px; border-radius: 999px; flex: none; }
  .catRow .cacts { display: flex; gap: 2px; flex: none; }
  .manageList .empty { color: var(--faint); text-align: center; padding: 30px 10px;
    font-size: 13.5px; }
  /* "Was ist neu"-Fenster */
  .newsBody { max-height: 52vh; overflow-y: auto; font-size: 14px;
    line-height: 1.75; color: #2a332e; }
  .newsBody p { margin: 0 0 9px; }
  .newsBody ul { margin: 0 0 9px; padding-inline-start: 20px; }
  .newsBody li { margin-bottom: 5px; }
  .verLabel { cursor: pointer; }
  .verLabel:hover { color: var(--accent-ink); }
  .hint { font-size: 12.5px; color: var(--faint); margin-top: 12px; }
  .hint code { background: var(--surface); padding: 1px 6px; border-radius: 5px;
    font-size: 12px; color: var(--muted); }

  /* term groups */
  .termGroup { background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: var(--radius); padding: 9px 11px; display: flex;
    flex-wrap: wrap; gap: 7px; align-items: center; }
  .termGroup.focused { border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak); }
  .tchip { display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip-bg); color: var(--chip-ink); font-weight: 600;
    font-size: 13.5px; padding: 4px 6px 4px 11px; border-radius: 8px;
    max-width: 100%; }
  /* Sehr lange Begriffe umbrechen, statt das Fenster zu sprengen (C-4). Der
     Entfernen-Knopf bleibt so immer im sichtbaren Bereich. */
  .tchip > span { overflow-wrap: anywhere; word-break: break-word; min-width: 0; }
  .tchip button { border: 0; background: none; cursor: pointer; color: inherit;
    display: grid; place-items: center; padding: 0; flex: none; }
  .tchip.neg { background: var(--err-bg); color: var(--err-ink); }
  .termGroup input { flex: 1; min-width: 150px; border: 0; outline: none;
    font-family: inherit; font-size: 14.5px; background: none; padding: 5px 2px; }
  .orSep { text-align: center; color: var(--faint); font-weight: 600;
    font-size: 12px; letter-spacing: .04em; margin: 9px 0; text-transform: uppercase; }
  .termActions { display: flex; gap: 9px; margin-top: 13px; align-items: center;
    flex-wrap: wrap; }
  #mExcludeArea, #rExcludeArea { margin-top: 13px; }
  /* Großer "Suchen"-Button als letzter Schritt, unter allen Feldern/Filtern */
  .searchGo { width: 100%; justify-content: center; margin-top: 20px;
    padding: 13px 24px; font-size: 15.5px; font-weight: 600; border-radius: 11px; }
  #toTop { position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 50;
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--accent-ink); cursor: pointer;
    box-shadow: var(--shadow); display: grid; place-items: center;
    opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity .18s, transform .18s; }
  #toTop.show { opacity: 1; transform: none; pointer-events: auto; }
  #toTop:hover { background: var(--accent-weak); }
  #toTop svg { width: 20px; height: 20px; stroke: var(--accent); }
  /* Ausschluss-Felder rot markieren – „diese Wörter werden ausgeschlossen" */
  #mExcludeArea .termGroup, #rExcludeArea .termGroup {
    border-color: #e7b3ab; background: #fdf3f1; }
  #mExcludeArea .termGroup.focused, #rExcludeArea .termGroup.focused {
    border-color: var(--err); box-shadow: 0 0 0 3px #f6dcd7; }
  #mExcludeArea .orSep, #rExcludeArea .orSep { color: var(--err); }

  /* results */
  #results, #docResults { margin-top: 22px; display: flex;
    flex-direction: column; gap: 10px; }
  .resultCount { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .hit { background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 17px; cursor: pointer;
    transition: border-color .12s, box-shadow .12s; }
  .hit:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .hit .top { display: flex; align-items: center; gap: 10px; margin-bottom: 7px;
    flex-wrap: wrap; }
  .hit .htitle { font-weight: 600; font-size: 14.5px; }
  .hit .hauthor { color: var(--muted); font-size: 13px; }
  .hit .meta { margin-inline-start: auto; display: flex; align-items: center;
    gap: 8px; }
  .pageTag { background: var(--surface); color: var(--ink); font-weight: 600;
    font-size: 12.5px; padding: 3px 10px; border-radius: 7px; white-space: nowrap;
    border: 1px solid var(--line); }
  .rel { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    white-space: nowrap; cursor: help; }
  .rel.exact { background: var(--chip-bg); color: var(--chip-ink); }
  .rel.approx { background: var(--warn-bg); color: var(--warn-ink); }
  /* Aus der Online-Sammlung uebernommen: ruhig, kein Warnton -- die
     Angabe ist zitierfaehig, nur anderer Herkunft als eine PDF-Seite. */
  .rel.src { background: var(--chip-bg); color: var(--muted); }
  .dlTitle { font-size: 15px; font-weight: 600; margin: 4px 0 2px; }
  .dlAuthor { color: var(--muted); margin-bottom: 14px; }
  .dlFacts { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .dlFacts td { padding: 4px 0; }
  .dlFacts td:first-child { color: var(--muted); width: 45%; }
  .dlCheck { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .hit .text { line-height: 1.9; font-size: 14.5px; color: #2a332e;
    font-family: var(--arab); }
  mark { background: var(--hl); color: var(--hl-ink); font-weight: 600;
    padding: 0 2px; border-radius: 3px; }
  .empty { text-align: center; color: var(--faint); padding: 70px 20px;
    font-size: 14px; }
  .empty svg { stroke: var(--line-strong); width: 34px; height: 34px;
    margin-bottom: 12px; }

  /* ---------- Documents ---------- */
  #docsToolbar { max-width: 900px; margin: 0 auto 14px; display: none;
    align-items: center; gap: 16px; }
  .docList { max-width: 900px; margin: 0 auto; border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .docRow { display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .docRow:last-child { border-bottom: 0; }
  .docRow:hover { background: var(--surface); }
  .docRow input[type=checkbox] { accent-color: var(--accent); }
  .docMain { flex: 1; min-width: 0; }
  .docMain .dt { font-weight: 600; font-size: 14.5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .docMain .dm { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px;
    margin-top: 2px; }
  /* Fortschritt beim „Neu einlesen" – direkt in der Dokumentzeile. */
  .newsH { font-weight: 700; margin: 14px 0 4px; font-size: 14.5px; }
  /* Eigenes Bestätigungs-Modal (C-1) – ersetzt das native confirm(). */
  .cmOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.38);
    display: none; align-items: center; justify-content: center; z-index: 4000; }
  .cmBox { background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px 24px; max-width: 420px; width: calc(100% - 48px);
    box-shadow: 0 18px 50px rgba(0,0,0,.22); }
  .cmMsg { font-size: 15px; line-height: 1.5; color: var(--ink); }
  .cmBtns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .docProg { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .docProg .rst { font-size: 12px; color: var(--accent-ink); font-weight: 600; }
  .docRow.busy { background: var(--surface); }
  .docActions { display: flex; gap: 2px; flex: none; }
  .iconBtn { width: 32px; height: 32px; border: 0; background: none;
    border-radius: 8px; cursor: pointer; color: var(--muted);
    display: grid; place-items: center; transition: background .12s, color .12s; }
  .iconBtn:hover { background: var(--accent-weak); color: var(--accent-ink); }
  .iconBtn.danger:hover { background: #fbeae7; color: var(--err); }

  /* ---------- Upload ---------- */
  #dropzone { max-width: 900px; margin: 0 auto; border: 1.5px dashed var(--line-strong);
    border-radius: 14px; background: var(--surface); padding: 54px 30px;
    text-align: center; transition: border-color .15s, background .15s; }
  #dropzone.drag { border-color: var(--accent); background: var(--accent-weak); }
  #dropzone .dzIcon { width: 52px; height: 52px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line);
    display: inline-grid; place-items: center; margin-bottom: 16px; }
  #dropzone .dzIcon svg { width: 24px; height: 24px; stroke: var(--accent); }
  #dropzone h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  #dropzone p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  #uploadJobs { max-width: 900px; margin: 20px auto 0; display: flex;
    flex-direction: column; gap: 8px; }
  .ujob { background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 11px 15px; display: flex;
    flex-direction: column; gap: 8px; font-size: 13.5px; }
  .ujobTop { display: flex; gap: 12px; align-items: center; }
  .ujob svg { stroke: var(--faint); }
  .ujob .st { margin-inline-start: auto; color: var(--muted); font-size: 12.5px;
    white-space: nowrap; }
  .ujob.done .st { color: var(--accent-ink); font-weight: 600; }
  .ujob.err .st { color: var(--err); font-weight: 600; }
  .ujob.skip { opacity: .6; }

  /* ---------- Fortschrittsbalken (wiederverwendbar: Upload + Dokumentzeile) ---- */
  .pbar { height: 5px; width: 100%; background: var(--line);
    border-radius: 4px; overflow: hidden; }
  .pfill { height: 100%; width: 0; background: var(--accent);
    border-radius: 4px; transition: width .18s linear; }
  /* Unbestimmt: kurze Phasen ohne bekannte Gesamtmenge (z. B. Word-Umwandlung).
     margin-inline-start ist schreibrichtungssicher (RTL/LTR). */
  .pfill.indet { width: 35%; transition: none;
    animation: pindet 1.1s ease-in-out infinite; }
  @keyframes pindet { 0% { margin-inline-start: -35%; }
    100% { margin-inline-start: 100%; } }

  /* ---------- Reader (research view) ---------- */
  #reader { position: fixed; inset: 0; background: var(--bg); display: none;
    z-index: 60; flex-direction: column; }
  #reader.open { display: flex; }
  #reader header { display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); flex: none; }
  #reader .rTitle { font-weight: 650; font-size: 15px; }
  #reader .rAuthor { color: var(--muted); font-size: 13px; }
  #reader .rNav { margin-inline-start: auto; display: flex; align-items: center;
    gap: 6px; }
  #rPageInd { font-size: 13px; color: var(--muted); min-width: 96px;
    text-align: center; }
  #reader .rBody { flex: 1; display: grid; grid-template-columns: 340px 1fr;
    min-height: 0; }
  #rSidebar { border-inline-end: 1px solid var(--line); display: flex;
    flex-direction: column; min-height: 0; background: var(--surface); }
  #rSearchBar { padding: 12px; border-bottom: 1px solid var(--line); flex: none; }
  #rResults { overflow-y: auto; padding: 8px; display: flex;
    flex-direction: column; gap: 6px; }
  .rHit { background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 13px; }
  .rHit:hover { border-color: var(--accent); }
  .rHit.active { border-color: var(--accent); background: var(--accent-weak); }
  .rHit .rp { font-weight: 600; color: var(--accent-ink); font-size: 12px;
    margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .rHit .bmBtn { margin-inline-start: auto; border: 0; background: none;
    cursor: pointer; color: var(--faint); padding: 2px; border-radius: 6px;
    display: grid; place-items: center; }
  .rHit .bmBtn svg { width: 15px; height: 15px; }
  .rHit .bmBtn:hover { color: var(--accent); background: var(--accent-weak); }
  .rHit .bmBtn.on { color: var(--accent); }
  .rHit .bmBtn.on svg { fill: var(--accent); }
  .rHit .rtext { color: #2a332e; line-height: 1.7; font-family: var(--arab); }
  /* Lesefluss: Seiten als Blätter untereinander */
  #rReading { overflow-y: auto; background: var(--surface);
    padding: 26px 24px 70px; --rfont: 1;
    -webkit-user-select: text; user-select: text; }
  /* Platzhalter für die nicht gerenderten Seiten ober-/unterhalb des
     Fensters. Sie tragen nur Höhe, damit Scrollbalken und Sprungziele
     stimmen, ohne dass für jede Buchseite ein Knoten existiert. */
  .pageSpacer { margin: 0; padding: 0; width: 100%; pointer-events: none; }
  .pageSheet { position: relative; max-width: 820px; margin: 0 auto 30px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 44px 48px 46px; min-height: 260px; }
  .pageSheet .pageNum { position: absolute; top: -11px; inset-inline-start: 26px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 12px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .pageSheet .pageText { white-space: pre-wrap; word-break: break-word;
    line-height: 2.2; font-size: calc(16.5px * var(--rfont));
    font-family: var(--rArab); color: var(--ink);
    -webkit-user-select: text; user-select: text; cursor: text; }
  /* Leere „…"-Blätter nutzen eine feste Schrift statt var(--arab). So bricht
     ein Schrift-/Fett-Wechsel nur die wenigen GELADENEN Blätter neu um (nicht
     alle tausend Platzhalter) – ohne das Scrollen anzufassen. */
  .pageSheet.loading .pageText { color: var(--faint); font-family: var(--sans);
    font-weight: 400; }
  .pageSheet img { max-width: 100%; display: block; margin: 0 auto;
    border-radius: 6px; }
  .pageSheet.current { border-color: var(--line-strong); }
  /* Text in Treffern und Leser markierbar/kopierbar */
  .hit .text, .rHit .rtext, #rReading, .passageBox {
    -webkit-user-select: text; user-select: text; }
  .passageBox { background: #fff6d9; border-inline-start: 4px solid var(--accent);
    padding: 8px 13px; border-radius: 8px; }
  #rReading mark { font-weight: 700; }
  /* Kopfzeile: Fortschritt, Seitensprung, Schriftgröße, Treffer */
  #rProgress { height: 3px; background: var(--line); flex: none; }
  #rProgressBar { height: 100%; width: 0; background: var(--accent);
    transition: width .12s linear; }
  .pageJump { display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--muted); }
  .pageJump input { width: 62px; text-align: center; padding: 5px 6px;
    border: 1px solid var(--line-strong); border-radius: 8px; font-family: inherit;
    font-size: 13px; background: var(--panel); color: var(--ink); }
  .pageJump input:focus { outline: none; border-color: var(--accent); }
  .fontCtl { display: inline-flex; gap: 4px; }
  .fontCtl .btn { padding: 5px 9px; }
  /* Typografie-Panel (Schriftart + kräftiger) */
  .typoWrap { position: relative; display: inline-flex; }
  #rTypo { font-family: var(--arab); font-weight: 600; padding: 5px 11px; }
  .typoPanel { position: absolute; top: calc(100% + 8px); inset-inline-end: 0;
    z-index: 60; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px;
    width: 232px; }
  .typoLbl { font-size: 11.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .3px; margin: 0 0 8px; }
  .typoFonts { display: flex; flex-direction: column; gap: 6px; }
  .typoFont { text-align: start; padding: 8px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer;
    font-family: var(--arab); font-size: 17px; line-height: 1.2; }
  .typoFont:hover { border-color: var(--line-strong); }
  .typoFont.active { border-color: var(--accent); background: var(--accent-weak); }
  .typoBold { margin-top: 10px; width: 100%; display: flex; align-items: center;
    justify-content: center; gap: 8px; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    cursor: pointer; font-size: 13.5px; font-weight: 700; }
  .typoBold:hover { border-color: var(--line-strong); }
  .typoBold.on { border-color: var(--accent); background: var(--accent-weak);
    color: var(--accent); }
  /* „kräftiger": Inhaltstext fett (Leserseiten + Trefferausschnitte) */
  /* „kräftiger" wirkt nur auf den Lese-Dokumenttext, nicht auf die Oberfläche. */
  .arBold .pageSheet:not(.loading) .pageText { font-weight: 700; }
  #rHitNav { display: inline-flex; align-items: center; gap: 4px; }
  #rHitCount { font-size: 12.5px; color: var(--muted); min-width: 62px;
    text-align: center; }
  #rBookmark.on svg { fill: var(--accent); stroke: var(--accent); }
  /* Schwebender "Zitat kopieren"-Knopf bei Textauswahl */
  #citeBtn { position: fixed; z-index: 80; display: none; align-items: center;
    gap: 7px; background: var(--ink); color: #fff; border: 0; cursor: pointer;
    padding: 8px 13px; border-radius: 9px; font-size: 13px; font-family: inherit;
    box-shadow: var(--shadow); }
  #citeBtn svg { stroke: #fff; width: 15px; height: 15px; }
  /* Lesezeichen */
  #bmList { display: flex; flex-direction: column; gap: 22px; margin-top: 6px; }
  .bmGroup > h3 { margin: 0 0 10px; font-size: 14.5px; font-weight: 650; }
  .bmItem { background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 15px; margin-bottom: 9px;
    display: flex; gap: 12px; align-items: flex-start; }
  .bmItem .bmMain { flex: 1; min-width: 0; cursor: pointer; }
  .bmItem .bmPage { font-size: 12px; font-weight: 600; color: var(--accent-ink);
    margin-bottom: 4px; }
  .bmItem .bmText { font-size: 14px; line-height: 1.8; color: #2a332e; }
  .bmItem .bmNoteIn { margin-top: 9px; width: 100%; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 13px;
    background: var(--bg); color: var(--ink); }
  .bmItem .bmNoteIn:focus { outline: none; border-color: var(--accent); }
  .bmItem.missing { opacity: .6; }
  .hit .bmBtn { border: 0; background: none; cursor: pointer; color: var(--faint);
    padding: 3px; border-radius: 6px; display: grid; place-items: center; }
  .hit .bmBtn:hover { color: var(--accent); background: var(--accent-weak); }
  .hit .bmBtn.on { color: var(--accent); }
  .hit .bmBtn.on svg { fill: var(--accent); }

  /* toast + error */
  #toast, #errbar { position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%); padding: 11px 20px; border-radius: 10px;
    font-size: 14px; z-index: 99; box-shadow: var(--shadow); display: none; }
  #toast { background: var(--ink); color: #fff; }
  #errbar { background: var(--err); color: #fff; }
  .spin { width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Auffälliger Ladehinweis auf hellem Grund (Suche, Leser, ladende Seiten).
     Akzentfarbener Ring – deutlich sichtbare Bewegung, nicht weiß-auf-weiß. */
  .loadBox { display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 60px 16px; }
  .ring { width: 40px; height: 40px; border-radius: 50%; flex: none; display: block;
    border: 4px solid var(--accent-weak); border-top-color: var(--accent);
    animation: spin .8s linear infinite; }
  .ring.sm { width: 26px; height: 26px; border-width: 3px; }
  .loadBox .txt { font-size: 16px; font-weight: 600; color: var(--muted);
    font-family: var(--arab); }
  /* Arabische Oberfläche: GLEICHE Größe wie Deutsch – nur etwas kräftiger, weil
     Noto Sans Arabic bei gleichem Gewicht dünner/blasser wirkt als die lateinische
     Schrift. So ist sie so gut sichtbar wie die (fette) deutsche Ansicht. */
  [dir="rtl"] { font-weight: 500; }
  [dir="rtl"] .navItem { font-weight: 600; }
  .verLabel { font-size: 11.5px; color: var(--faint); padding: 8px 11px 2px;
    letter-spacing: .02em; }
  /* Quellen-Umschalter (Bibliothek / Shamela online) */
  #srcToggle { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .srcSeg { display: inline-flex; background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 9px; padding: 3px; }
  .srcBtn { border: none; background: transparent; color: var(--muted); cursor: pointer;
    padding: 6px 15px; border-radius: 7px; font-size: 13.5px; font-family: inherit; font-weight: 500; }
  .srcBtn.active { background: var(--accent); color: #fff; }
  .srcGear { border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
    cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: inline-flex;
    align-items: center; justify-content: center; }
  .srcGear:hover { color: var(--ink); }
  .srcGear .ic { width: 17px; height: 17px; }
  .shamelaState { font-size: 12.5px; color: var(--muted); }
  .shamelaState.ok { color: var(--accent); }
  .shamelaState.off { color: var(--err); }
  .mfHint { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0 0 14px; }
  .shamelaMsg { font-size: 12.5px; margin-top: 12px; min-height: 18px; }
  .shamelaMsg.ok { color: var(--accent); }
  .shamelaMsg.err { color: var(--err); }
  .onlineBadge { display: inline-block; font-size: 11px; font-weight: 600; color: #fff;
    background: var(--accent); border-radius: 5px; padding: 1px 7px; margin-inline-start: 8px;
    vertical-align: middle; letter-spacing: .02em; }
</style>
</head>
<body>
<div id="app">
  <nav>
    <div class="brand">
      <span class="dot" id="brandIcon"></span> AICP Research
    </div>
    <button class="navItem" data-view="search"><span class="ci" data-ic="search"></span><span id="navSearch"></span></button>
    <button class="navItem" data-view="docs"><span class="ci" data-ic="docs"></span><span id="navDocs"></span></button>
    <button class="navItem" data-view="upload"><span class="ci" data-ic="upload"></span><span id="navUpload"></span></button>
    <button class="navItem" data-view="bookmarks"><span class="ci" data-ic="bookmark"></span><span id="navBookmarks"></span></button>
    <div class="navCollections" id="navCollections">
      <div class="navSecLabel" id="collTitle"></div>
      <button class="navItem" id="navAuthorsBtn"><span class="ci" data-ic="author"></span><span id="collAuthorsLabel"></span></button>
      <button class="navItem" id="navCatsBtn"><span class="ci" data-ic="tag"></span><span id="collCatsLabel"></span></button>
    </div>
    <div class="navSpacer"></div>
    <div id="navStatus"><span class="pulse"></span><span id="navStatusText"></span></div>
    <div class="navSection">
      <button class="navItem updateItem" id="updateBtn" style="display:none"><span class="ci" data-ic="download"></span><span id="updateLabel"></span></button>
      <button class="navItem subtle" id="exportBtn"><span class="ci" data-ic="export"></span><span id="exportLabel"></span></button>
      <button class="navItem subtle" id="importBtn"><span class="ci" data-ic="import"></span><span id="importLabel"></span></button>
      <button class="navItem subtle" id="langBtn"><span class="ci" data-ic="globe"></span><span id="langLabel"></span></button>
      <div id="versionLabel" class="verLabel"></div>
    </div>
  </nav>

  <!-- Suche -->
  <section class="view active" id="view-search">
    <div class="viewHead"><h1 class="title" id="titleSearch"></h1></div>
    <div class="viewInner">
      <div id="srcToggle">
        <div class="srcSeg">
          <button class="srcBtn active" data-src="local" id="srcLocalBtn"></button>
          <button class="srcBtn" data-src="shamela" id="srcShamelaBtn"></button>
        </div>
        <button class="srcGear" id="shamelaCfgBtn" title=""><span class="ci" data-ic="gear"></span></button>
        <span id="shamelaState" class="shamelaState"></span>
      </div>
      <div id="mGroups"></div>
      <div id="mExcludeArea" style="display:none">
        <div class="orSep" id="mExcludeLabel"></div>
        <div class="termGroup" id="mExcludeGroup"><input id="mExcludeInput"></div>
      </div>
      <div class="termActions">
        <button id="mAddGroup" class="btn sm"></button>
        <button id="mToggleExclude" class="btn sm"></button>
      </div>

      <div class="filters">
        <label><span id="authorLabel"></span>
          <span class="authorFilter" id="authorFilter">
            <input id="authorSel" autocomplete="off">
          </span></label>
        <label><span id="bookLabel"></span>
          <span class="authorFilter" id="bookFilter">
            <input id="bookSel" autocomplete="off">
          </span></label>
        <label><span id="categoryLabel"></span>
          <span class="authorFilter" id="catFilter">
            <input id="catSel" autocomplete="off">
          </span></label>
        <label class="switch"><input type="checkbox" id="semantic" checked>
          <span id="semanticLabel"></span></label>
      </div>

      <button id="mSearchBtn" class="btn primary searchGo"></button>
      <div id="count" class="resultCount"></div>
      <div id="results"></div>
    </div>
  </section>

  <!-- Dokumente -->
  <section class="view" id="view-docs">
    <div class="viewHead"><h1 class="title" id="titleDocs"></h1></div>
    <div id="docsToolbar">

// Eigenes Bestätigungs-Modal statt des nativen confirm() – dieses zeigt im
// pywebview-Fenster „127.0.0.1:PORT enthält …" mit System-Buttons (C-1).
// Liefert ein Promise<boolean>. Enter = bestätigen, Escape/Klick daneben = ab.
function appConfirm(message,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    let ov=$("#confirmModal");
    if(!ov){
      ov=document.createElement("div");ov.id="confirmModal";ov.className="cmOverlay";
      ov.innerHTML=`<div class="cmBox"><div class="cmMsg"></div>
        <div class="cmBtns"><button class="btn ghost cmNo"></button><button class="btn cmYes"></button></div></div>`;
      document.body.appendChild(ov);
    }
    ov.querySelector(".cmMsg").textContent=message;
    const yes=ov.querySelector(".cmYes"),no=ov.querySelector(".cmNo");
    yes.textContent=opts.okText||t("confirmYes");
    no.textContent=opts.cancelText||t("confirmNo");
    yes.classList.toggle("danger",opts.danger!==false);
    ov.style.display="flex";
    const onYes=()=>close(true),onNo=()=>close(false);
    const onBack=e=>{ if(e.target===ov)close(false); };
    const onKey=e=>{ if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close(false);}
                     else if(e.key==="Enter"){e.preventDefault();e.stopPropagation();close(true);} };
    function close(val){
      ov.style.display="none";
      yes.removeEventListener("click",onYes);no.removeEventListener("click",onNo);
      ov.removeEventListener("click",onBack);document.removeEventListener("keydown",onKey,true);
      resolve(val);
    }
    yes.addEventListener("click",onYes);no.addEventListener("click",onNo);
    ov.addEventListener("click",onBack);document.addEventListener("keydown",onKey,true);
    yes.focus();
  });
}
function relTag(rel){
  if(rel==="ungefähr") return `<span class="rel approx" title="${esc(t('relApproxHint'))}">${esc(t('relApprox'))}</span>`;
  // Aus der Online-Sammlung übernommen: die Seitenzahl stammt unverändert
  // von dort und wurde nie neu berechnet – das ist etwas anderes als eine
  // selbst geprüfte PDF-Seite und soll im Treffer sichtbar sein.
  if(rel==="shamela") return `<span class="rel src" title="${esc(t('relShamelaHint'))}">${esc(t('relShamela'))}</span>`;
  // „sicher" (PDF) und „exakt" (Word) sind beide zitierfähige Druckseiten.
  // Ein UNBEKANNTER Wert fällt bewusst auf „ungefähr" zurück, nicht auf
  // „exakt" – so wird nie fälschlich Zitierfähigkeit vorgetäuscht (K-4).
  if(rel==="sicher"||rel==="exakt")
    return `<span class="rel exact" title="${esc(t('relExactHint'))}">${esc(t('relExact'))}</span>`;
  return `<span class="rel approx" title="${esc(t('relApproxHint'))}">${esc(t('relApprox'))}</span>`;
}
function pageStr(h){
  // Trägt das Buch eine echte Druckseite, wird IMMER sie gezeigt –
  // page_from ist bei übernommenen Büchern nur eine Blattnummer.
  if(h.page_label) return esc(h.page_label);
  const p=t("pagePrefix");return h.page_from===h.page_to?`${p} ${h.page_from}`:`${p} ${h.page_from}–${h.page_to}`;
}

/* ---------- Auswahl-Dropdown (Combobox, ersetzt <datalist>) ---------- */
// input: das Textfeld; getOptions(): aktuelle Kandidatenliste (Strings);
// onPick(v): Auswahl/Bestätigung; opts.onBackspace / opts.clearOnBlur.
function attachCombo(input, getOptions, onPick, opts={}){
  const host=input.closest(".authorFilter,.chipField")||input.parentElement;
  const panel=document.createElement("div");panel.className="comboPanel";
  host.appendChild(panel);
  let items=[], active=-1;
  function render(){
    const q=(input.value||"").trim().toLowerCase();
    items=(getOptions()||[]).filter(o=>!q||String(o).toLowerCase().includes(q));
    active=-1;
    if(!items.length){ panel.classList.remove("show"); panel.innerHTML=""; return; }
    panel.innerHTML=items.map((o,i)=>
      `<div class="comboOpt" data-i="${i}" dir="auto">${esc(o)}</div>`).join("");
    panel.classList.add("show");
  }
  function close(){ panel.classList.remove("show"); active=-1; }
  function hl(){ [...panel.children].forEach((c,i)=>c.classList.toggle("active",i===active));
    if(active>=0&&panel.children[active])panel.children[active].scrollIntoView({block:"nearest"}); }
  input.addEventListener("input",render);
  input.addEventListener("focus",render);
  input.addEventListener("keydown",e=>{
    const open=panel.classList.contains("show");
    if(e.key==="ArrowDown"){ e.preventDefault(); if(!open)render();
      active=Math.min(active+1,items.length-1); hl(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); if(open){active=Math.max(active-1,0);hl();} }
    else if(e.key==="Enter"){ e.preventDefault();
      if(open&&active>=0) onPick(items[active]);
      else if((input.value||"").trim()) onPick(input.value.trim());
      close(); }
    else if(e.key==="Escape"){ if(open){e.preventDefault();close();} }
    else if(e.key==="Backspace"&&!input.value&&opts.onBackspace){ e.preventDefault();opts.onBackspace(); }
  });
  panel.addEventListener("mousedown",e=>{
    const el=e.target.closest(".comboOpt"); if(!el)return;
    e.preventDefault(); onPick(items[+el.dataset.i]); close();
  });
  input.addEventListener("blur",()=>setTimeout(()=>{ close();
    if(opts.clearOnBlur)input.value=""; },130));
  return { render, close };
}

// Dokumente, die gerade neu eingelesen werden: Dateiname -> gemerkte Doc-Daten.
// So bleibt die Zeile im Dokumente-Tab an Ort und Stelle (mit Balken), auch
// während der Reindex das Dokument in der DB kurz löscht und neu anlegt.
const reindexing=new Map();
function baseName(p){ return (p||"").split(/[\\/]/).pop()||""; }

// Baut eine Dokumentzeile. `placeholder`=true für Zeilen, deren DB-Eintrag
// gerade (mitten im Reindex) fehlt – dann nur Anzeige, keine Aktionen.
function buildDocRow(d,placeholder){
  const row=document.createElement("div");row.className="docRow";
  const fn=baseName(d.file_path); if(fn)row.dataset.file=fn;
  // Läuft für dieses Dokument gerade ein Reindex, ist die Zeile „busy": KEINE
  // Aktionen, KEIN Öffnen des Lesers (S-6). Sonst könnte man ein Dokument
  // öffnen, dessen Seiten gerade gelöscht sind (leerer Dauerlade-Leser), oder
  // „Neu einlesen" mehrfach anstoßen.
  const busy=!!(fn&&reindexing.has(fn));
  const locked=placeholder||busy;
  const acts=locked?"":`
      <div class="docActions">
        <button class="iconBtn" data-act="download" title="${esc(t("download"))}">${svg("download")}</button>
        <button class="iconBtn" data-act="edit" title="${esc(t("edit"))}">${svg("edit")}</button>
        <button class="iconBtn" data-act="rescan" title="${esc(t("rescan"))}">${svg("rescan")}</button>
        <button class="iconBtn danger" data-act="del" title="${esc(t("del"))}">${svg("trash")}</button>
      </div>`;
  row.innerHTML=`
      <input type="checkbox" class="selBox" data-id="${d.id}" ${!locked&&selectedForExport.has(d.id)?"checked":""} ${locked?"disabled":""}>
      <div class="docMain">
        <div class="dt">${esc(d.title)}</div>
        <div class="dm"><span>${esc(authorText(d.author))}</span>
          <span>${d.page_count||"?"} ${esc(t("pages"))}</span>
          <span>${d.passage_count!=null?d.passage_count+" "+esc(t("passages")):""}</span></div>
      </div>${acts}`;
  if(!locked){
    row.addEventListener("click",e=>{
      const box=e.target.closest("[data-act],.selBox");
      if(e.target.classList.contains("selBox")){
        const id=+e.target.dataset.id;
        e.target.checked?selectedForExport.add(id):selectedForExport.delete(id);
        updateSelCount();return;
      }
      const act=box&&box.dataset&&box.dataset.act;
      if(!act){ openReader(d.id); return; }
      if(act==="del"){ appConfirm(t("confirmDelete")+d.title,{okText:t("del")}).then(ok=>{ if(!ok)return; api().delete_document(d.id)
          .then(r=>{ if(r&&r.error)return showError(r.error); refreshDocs(); showToast("1 "+t("deletedN")); })
          .catch(()=>showError(t("errGeneric"))); }); }
      else if(act==="rescan"){ startReindex(d); }
      else if(act==="edit"){ openEditDialog(d); }
      else if(act==="download"){ api().download_document(d.id).then(r=>{
        if(r&&r.error)showError(r.error); else if(r&&r.path)showToast(t("downloadDone")); }); }
    });
  }
  // Läuft für dieses Dokument gerade ein Reindex? Dann Balken in die Zeile.
  if(busy){
    row.classList.add("busy");
    const dm=row.querySelector(".docMain");
    const prog=document.createElement("div");prog.className="docProg";
    prog.innerHTML=`<span class="rst">${esc(T[lang].jobs.wartet)}</span><div class="pbar"><div class="pfill indet"></div></div>`;
    dm.appendChild(prog);
  }
  return row;
}

// „Neu einlesen" starten: Zeile sofort mit Balken zeigen, ohne Tab-Wechsel.
function startReindex(d){
  const fn=baseName(d.file_path);
  if(fn&&reindexing.has(fn))return;   // läuft bereits – Mehrfachklick ignorieren (S-6)
  if(fn)reindexing.set(fn,d);
  refreshDocs();            // Zeile sofort mit Balken rendern
  api().reindex_document(d.id,false).then(r=>{
    if(r&&r.error){ if(fn)reindexing.delete(fn); showError(r.error); refreshDocs(); }
    refreshStatus();
  }).catch(e=>{ if(fn)reindexing.delete(fn); showError(String(e)); refreshDocs(); });
}

// Balken/Text der Reindex-Zeilen bei jedem Status-Poll aktualisieren.
function updateReindexRows(jobs){
  if(!reindexing.size)return;
  const byFile={}; for(const j of (jobs||[]))byFile[j.file]=j;
  let fertig=false;
  for(const fn of [...reindexing.keys()]){
    const j=byFile[fn];
    if(j&&["fertig","fehler","übersprungen"].includes(j.state)){
      reindexing.delete(fn); fertig=true; continue;
    }
    let row=null;
    try{ row=document.querySelector(`.docRow[data-file="${(window.CSS&&CSS.escape)?CSS.escape(fn):fn}"]`); }catch(e){}
    if(!j||!row)continue;
    const rst=row.querySelector(".rst");if(rst)rst.textContent=jobLabel(j);
    const fill=row.querySelector(".pfill");
    if(fill){
      if(typeof j.pct==="number"){ fill.classList.remove("indet"); fill.style.width=Math.max(0,Math.min(100,j.pct))+"%"; }
      else { fill.classList.add("indet"); fill.style.width=""; }
    }
  }
  // Ein fertiger Reindex: frische Zeile mit neuen Zahlen nachladen.
  if(fertig)refreshDocs();
}

async function refreshDocs(){
  const docs=await api().list_documents();
  // Such-Filter (Autor/Buch) nur im lokalen Modus aus der Bibliothek füllen.
  // Im Shamela-Modus kommen die Optionen vom Server – hier NICHT überschreiben,
  // sonst tauchen im Online-Modus plötzlich die Offline-Bücher/-Autoren auf.
  if(searchSource!=="shamela"){
    const auth=[];for(const d of docs)auth.push(...splitAuthors(d.author));
    fillAuthorSel(auth);
    fillBookSel(docs);    // Buchfilter-Vorschläge (Titel -> id)
  }
  const box=$("#docList");box.innerHTML="";
  box.style.display=docs.length?"":"none";
  $("#docsToolbar").style.display=docs.length?"flex":"none";
  $("#docsEmpty").style.display=docs.length?"none":"";
  $("#docsEmpty").textContent=t("noDocs");
  const ids=new Set(docs.map(d=>d.id));
  selectedForExport=new Set([...selectedForExport].filter(i=>ids.has(i)));
  const vorhanden=new Set(docs.map(d=>baseName(d.file_path)));
  // DB-Dokumente plus Platzhalter für gerade neu eingelesene, die (mitten im
  // Reindex) kurz aus der DB fehlen – gemeinsam nach created_at sortiert, damit
  // die Reindex-Zeile AN IHRER STELLE bleibt und nicht an den Listenanfang
  // springt (S-6). So verschwindet die Zeile nie und wandert nicht.
  const shown=docs.map(d=>({d,ph:false}));
  for(const [fn,info] of reindexing){
    if(!vorhanden.has(fn)) shown.push({d:info,ph:true});
  }
  shown.sort((a,b)=>String(b.d.created_at||"").localeCompare(String(a.d.created_at||"")));
  for(const it of shown) box.appendChild(buildDocRow(it.d,it.ph));
  if(reindexing.size){ box.style.display=""; $("#docsToolbar").style.display="flex";
    $("#docsEmpty").style.display="none"; }
  updateSelCount();
  collDocs=docs;     // dieselben Daten für die Sammlungs-Index-Seiten nutzen
}
function updateSelCount(){
  const n=selectedForExport.size;
  const act=$("#selActions");if(act)act.style.display=n?"inline-flex":"none";
  const c=$("#selCount");if(c)c.textContent=n?`${n} ${t("selectedN")}`:"";
  const b=$("#exportSelBtn");if(b)b.textContent=`${t("exportSel")} (${n})`;
  const d=$("#delSelBtn");if(d)d.textContent=`${t("deleteSel")} (${n})`;
}

// Namen + Buchanzahl je nach Art bestimmen
async function loadIndexEntries(kind){
  if(!collDocs.length) await refreshCollectionData();
  if(kind==="author"){
    // Serverliste (mit Zählern, auch leere Autoren) – wie Kategorien
    let auth=[];
    try{ auth=await api().list_authors(); }catch(e){}
    return auth.map(a=>({name:a.name,count:a.count||0}))
      .sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  }
  let cats=[];
  try{ cats=await api().list_categories(); }catch(e){}
  return cats.map(c=>({name:c.name,count:c.count||0}));
}
function renderIndexList(filter){
  const box=$("#indexList");if(!box)return;
  const q=(filter||"").trim().toLowerCase();
  const list=indexEntries.filter(e=>!q||e.name.toLowerCase().includes(q));
  box.innerHTML="";
  $("#indexEmpty").style.display=list.length?"none":"";
  $("#indexEmpty").textContent = indexEntries.length
    ? t("indexNoMatch")
    : (indexKind==="author"?t("collNoAuthors"):t("collNoCats"));
  box.style.display=list.length?"":"none";
  for(const e of list){
    const b=document.createElement("button");b.className="indexItem";
    b.setAttribute("dir","auto");
    b.innerHTML=`<span class="in">${esc(e.name)}</span>`
      +`<span class="ic-count">${t("catBooksN")(e.count)}</span>`
      +`<span class="chev">${svg("next")}</span>`;
    b.onclick=()=>openCollection(indexKind,e.name);
    box.appendChild(b);
  }
}
async function openIndex(kind){
  indexKind=kind;
  await refreshCollectionData();
  $("#indexTitle").textContent = kind==="author"?t("collByAuthors"):t("collByCategories");
  $("#indexSearch").placeholder = kind==="author"?t("indexSearchAuthors"):t("indexSearchCats");
  $("#indexSearch").value="";
  $("#indexManageBtn").textContent = kind==="author"?t("manageAuthors"):t("manageCategories");
  indexEntries=await loadIndexEntries(kind);
  renderIndexList("");
  setView("index");

function openCollection(kind,name){

    ? splitAuthors(d.author).includes(name)

  $("#collBackLabel").textContent = kind==="author"?t("collByAuthors"):t("collByCategories");

  $("#collEmpty").style.display=books.length?"none":"";
  $("#collEmpty").textContent=t("collEmpty");
  box.style.display=books.length?"":"none";
  for(const d of books){
    const row=document.createElement("div");row.className="docRow";
    row.style.cursor="pointer";
    row.innerHTML=`
      <div class="docMain">

        <div class="dm"><span>${esc(authorText(d.author))}</span>

async function openEditDialog(d){
  editState={id:d.id,authors:splitAuthors(d.author),
             categories:(d.categories||[]).slice(),origTitle:d.title||""};
  // Vorschlagslisten (auch leere Autoren/Kategorien) für die Dropdowns laden
  await refreshAuthorSources();
  $("#editHead").textContent=t("editTitle");

  inp.placeholder=t("authorAdd");inp.setAttribute("dir","auto");
  box.appendChild(inp);
  attachCombo(inp,
    ()=>authorOptions.filter(a=>!editState.authors.includes(a)),
    v=>addAuthorFromInput(v),
    {onBackspace:()=>{ if(editState.authors.length){editState.authors.pop();renderAuthorChips();} }});

  const cinp=document.createElement("input");cinp.id="catChipInput";
  cinp.placeholder=t("categoryAdd");cinp.setAttribute("dir","auto");
  cbox.appendChild(cinp);
  attachCombo(cinp,

/* ---------- Status ---------- */
let _lastStatus=null;
function refreshStatusLabel(){
  if(!_lastStatus)return;
  const el=$("#navStatus");const s=_lastStatus.semantik;
  $("#navStatusText").textContent=T[lang].sem[s]||"";
  el.classList.toggle("off",s!=="bereit"&&s!=="lädt");
}
function jobLabel(j){
  // Zweisprachige Fehlermeldung über den stabilen Schlüssel (S-5); sonst der
  // vom Server gelieferte Klartext.
  if(j.error_key && T[lang].jobErr && T[lang].jobErr[j.error_key])
    return T[lang].jobErr[j.error_key];
  if(j.error)return j.error;
  const s=j.state||"";
  const direct=T[lang].jobs[s];
  // Messbare Phasen zeigen zusätzlich den Zähler (z. B. „Texterkennung 12/240").
  if(direct)return (j.total?`${direct} ${j.cur}/${j.total}`:direct);
  if(lang==="ar"){  // dynamische Zustände der Online-Buch-Übernahme (kein fester Schlüssel)
    const m=s.match(/^lädt … (\d+)\/(\d+)/);
    if(m)return `يُحمّل … ${m[1]}/${m[2]} صفحة`;
    if(s==="Buch wird vorbereitet")return "يُجهّز الكتاب";
    if(s==="wird eingeordnet")return "يُدرج في المكتبة";
    if(s==="berechnet die semantische Suche")return "يحسب البحث الدلالي";
  }
  return s;
}
// Balken-Markup für einen Job: fertige/fehlerhafte/übersprungene Jobs bekommen
// keinen Balken. Mit Zahl (pct) ein gefüllter Balken, sonst unbestimmt (animiert).
function jobBarHTML(j){
  if(["fertig","fehler","übersprungen"].includes(j.state))return "";
  if(typeof j.pct==="number")
    return `<div class="pbar"><div class="pfill" style="width:${Math.max(0,Math.min(100,j.pct))}%"></div></div>`;
  return `<div class="pbar"><div class="pfill indet"></div></div>`;
}
// Update-Knopf datengetrieben aus dem Status setzen – wird vom Job-Poll UND vom
// Heartbeat aufgerufen.
function applyUpdateBadge(update){
  const ub=$("#updateBtn"); if(!ub)return;
  const up=update||{};
  ub.style.display=up.available?"flex":"none";
  if(up.available&&up.latest)ub.title=`${T[lang].updateAvail}: ${up.latest}`;
}
// Langsamer Heartbeat: hält die Update-Erkennung am Leben, auch wenn der
// Job-Poll (refreshStatus) im Leerlauf stoppt. So erscheint „Update verfügbar"
// OHNE Neustart, sobald der Hintergrund-Check des Servers es gefunden hat.
let _updateHeartbeat=null;
function startUpdateHeartbeat(){
  if(_updateHeartbeat)return;
  _updateHeartbeat=setInterval(async()=>{
    try{ const st=await api().status(); _lastStatus=st; applyUpdateBadge(st.update); }
    catch(e){}
  }, 300000);   // alle 5 Minuten
}
// Genau EINE Poll-Schleife. Früher startete jeder Aufrufer (Start, Drop, Pick,
// Rescan) seine eigene, sich selbst neu planende Schleife – mehrere parallele
// Schleifen bauten die Job-Liste mehrmals pro Sekunde neu auf (Flackern).
// _statusBusy verhindert parallele Läufe, ein einziger Timer-Handle sorgt für
// genau eine geplante Fortsetzung, _statusAgain fängt Aufrufe während eines
// laufenden Fetches ab (damit ein frisch eingereihter Job sicher erscheint).
let _statusTimer=null,_statusBusy=false,_statusAgain=false;
function scheduleStatus(ms){ clearTimeout(_statusTimer); _statusTimer=setTimeout(refreshStatus,ms); }
async function refreshStatus(){
  if(_statusBusy){ _statusAgain=true; return; }
  _statusBusy=true; clearTimeout(_statusTimer); _statusTimer=null;
  try{
    const st=await api().status();_lastStatus=st;refreshStatusLabel();
    applyUpdateBadge(st.update);
    const jb=$("#uploadJobs");jb.innerHTML="";let active=false,doneCount=0;
    for(const j of st.jobs){
      if(j.file==="Export"||j.file==="Import"||j.file==="Update"||j.file==="Buchübernahme")continue;
      const erledigt=["fertig","fehler","übersprungen"].includes(j.state);
      // „Neu einlesen"-Jobs gehören in den Dokumente-Tab, nicht unter Hochladen.
      // Trotzdem als aktiv zählen, damit das Polling (und damit der Balken in
      // der Dokumentzeile) weiterläuft.
      if(reindexing.has(j.file)){ if(!erledigt)active=true; continue; }
      const el=document.createElement("div");
      el.className="ujob"+(j.state==="fehler"?" err":j.state==="fertig"?" done":j.state==="übersprungen"?" skip":"");
      const label=j.state==="übersprungen"?`${t("jobs")&&T[lang].jobs["übersprungen"]} – ${esc(j.error||"")}`:esc(jobLabel(j));
      el.innerHTML=`<div class="ujobTop">${svg("page")}<span>${esc(j.file)}</span><span class="st">${label}</span></div>${jobBarHTML(j)}`;
      jb.appendChild(el);
      if(["fertig","fehler","übersprungen"].includes(j.state))doneCount++;
      else active=true;
    }
    $("#jobsBar").style.display=doneCount?"flex":"none";
    // Fortschritt der „Neu einlesen"-Zeilen im Dokumente-Tab live aktualisieren.
    updateReindexRows(st.jobs);
    if(active||st.semantik==="lädt")scheduleStatus(1200);
    if(!active)refreshDocs();
  }catch(e){scheduleStatus(500);}
  finally{
    _statusBusy=false;
    if(_statusAgain){_statusAgain=false;scheduleStatus(150);}
  }
}

/* ---------- Such-Panel (überall gleich: Felder statt Syntax) ---------- */
// cfg: { groupsBox, excludeArea, excludeGroup, excludeInput, state, onSearch }
function renderPanel(cfg){
  const box=$(cfg.groupsBox);if(!box)return;box.innerHTML="";
  const st=cfg.state;
  st.groups.forEach((terms,gi)=>{
    if(gi>0){const s=document.createElement("div");s.className="orSep";s.textContent=t("orSep");box.appendChild(s);}
    const g=document.createElement("div");g.className="termGroup";
    terms.forEach((term,ti)=>{
      const chip=document.createElement("span");chip.className="tchip";
      chip.innerHTML=`<span>${esc(term)}</span>`;
      const del=document.createElement("button");del.innerHTML=svg("x");
      del.onclick=(e)=>{e.stopPropagation();st.groups[gi].splice(ti,1);
        if(!st.groups[gi].length&&st.groups.length>1)st.groups.splice(gi,1);renderPanel(cfg);maybeClearResults(cfg);};
      chip.appendChild(del);g.appendChild(chip);
    });
    const inp=document.createElement("input");
    inp.placeholder=gi===0&&!terms.length?t("termFirst"):t("termMore");
    inp.onkeydown=e=>{
      if(e.key==="Enter"){
        e.preventDefault();          // sonst quittiert macOS mit Fehlton
        if(inp.value.trim()){st.groups[gi].push(inp.value.trim());renderPanel(cfg);
          $(cfg.groupsBox).querySelectorAll(".termGroup input")[gi].focus();}
        else cfg.onSearch();
      } else if(e.key==="Backspace"&&!inp.value&&terms.length){
        e.preventDefault();
        st.groups[gi].pop();renderPanel(cfg);maybeClearResults(cfg);
        $(cfg.groupsBox).querySelectorAll(".termGroup input")[gi].focus();
      }
    };
    inp.onfocus=()=>g.classList.add("focused");inp.onblur=()=>g.classList.remove("focused");
    g.appendChild(inp);g.onclick=()=>inp.focus();box.appendChild(g);
  });
  renderPanelExclude(cfg);
}
function renderPanelExclude(cfg){
  const g=$(cfg.excludeGroup);if(!g)return;
  g.querySelectorAll(".tchip").forEach(c=>c.remove());
  const inp=$(cfg.excludeInput);
  cfg.state.excludes.forEach((term,ti)=>{
    const chip=document.createElement("span");chip.className="tchip neg";
    chip.innerHTML=`<span>${esc(term)}</span>`;
    const del=document.createElement("button");del.innerHTML=svg("x");
    del.onclick=(e)=>{e.stopPropagation();cfg.state.excludes.splice(ti,1);renderPanelExclude(cfg);maybeClearResults(cfg);};
    chip.appendChild(del);g.insertBefore(chip,inp);
  });
}
// Sind im Panel gar keine Begriffe/Ausschlüsse mehr übrig?
function panelEmpty(st){
  return !(st.groups||[]).some(g=>g.length) && !(st.excludes||[]).length;
}
// Wird der letzte Begriff/Ausschluss entfernt, die zugehörige Trefferliste
// leeren statt die alten Treffer stehen zu lassen (C-9).
function maybeClearResults(cfg){
  if(!panelEmpty(cfg.state))return;
  if(cfg===MAIN){
    mainQuery=null;shQuery=null;
    $("#results").innerHTML=emptyBox(searchSource==="shamela"?t("shamelaQueryHint"):t("start"));
    $("#count").textContent="";
  }else if(cfg===READER&&typeof showReaderHint==="function"){
    showReaderHint();rHits=[];if(typeof updateHitNav==="function")updateHitNav();
  }
}
// Offene Eingaben in den State übernehmen, dann Suchanfrage bauen
function collectPanel(cfg){
  const ei=$(cfg.excludeInput);
  if(ei&&ei.value.trim()){cfg.state.excludes.push(ei.value.trim());ei.value="";}
  $(cfg.groupsBox).querySelectorAll(".termGroup input").forEach((el,gi)=>{
    if(el.value.trim()){cfg.state.groups[gi].push(el.value.trim());el.value="";}
  });
  renderPanel(cfg);
  return { groups: cfg.state.groups.filter(g=>g.length),
           excludes: cfg.state.excludes.slice() };
}
function panelAddGroup(cfg){
  const st=cfg.state;
  if(st.groups[st.groups.length-1].length===0)return;
  st.groups.push([]);renderPanel(cfg);
  const inp=$(cfg.groupsBox).querySelectorAll(".termGroup input");
  inp[inp.length-1].focus();
}
function panelToggleExclude(cfg){
  const a=$(cfg.excludeArea);
  a.style.display=a.style.display==="none"?"":"none";
  cfg.state.excludeOpen=a.style.display!=="none";
  if(cfg.state.excludeOpen)$(cfg.excludeInput).focus();
}
function wireExcludeInput(cfg){
  const inp=$(cfg.excludeInput);
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();            // sonst quittiert macOS mit Fehlton
      if(inp.value.trim()){cfg.state.excludes.push(inp.value.trim());inp.value="";renderPanelExclude(cfg);}
      else cfg.onSearch();
    } else if(e.key==="Backspace"&&!inp.value&&cfg.state.excludes.length){
      e.preventDefault();
      cfg.state.excludes.pop();renderPanelExclude(cfg);
    }
  });
}

/* ---------- Shamela-Online-Suche ---------- */
let shQuery=null, shOffset=0, shLoaded=0;
function shamelaFilters(){
  const b={};
  if(catFilterSel.length)b.categories=catFilterSel.slice();
  if(authorFilterSel.length)b.authors=authorFilterSel.slice();
  if(bookFilterSel.length)b.book_ids=bookFilterSel.map(x=>x.id);
  // Grundlage ist die Wort-/Wurzelsuche; der Schalter nimmt die semantische
  // Suche dazu (wie offline). Standard: an.
  const sem=$("#semantic");
  b.semantic=sem?!!sem.checked:true;
  return b;
}
// Die Pillen gehen unverändert an den Server – als Gruppen (UND innerhalb,
// ODER dazwischen) plus globale Ausschlussliste, genau wie bei der lokalen
// Suche. Der Server baut daraus mit derselben Engine-Funktion die Suchgruppen
// (groups_from_terms), sodass UND/ODER/Ausschluss/Wortgruppe online exakt so
// wirken wie offline. Früher wurde hier flach zusammengesetzt, wodurch die
// ODER-Gruppen zu einer UND-Kette verschmolzen und die Ausschlüsse verfielen.
async function runShamelaSearch(){
  const st=await api().shamela_status().catch(()=>null);
  if(!st||!st.configured){ $("#results").innerHTML=emptyBox(t("shamelaNeedCfg")); $("#count").textContent=""; shQuery=null; return; }
  const { groups, excludes } = collectPanel(MAIN);
  // Ohne positiven Begriff gibt es nichts zu suchen: eine reine Ausschluss-
  // liste würde die ganze Sammlung bedeuten. Das sagt der Hinweis deutlich,
  // statt stumm null Treffer zu zeigen.
  if(!groups.length){
    $("#results").innerHTML=emptyBox(excludes.length?t("shamelaNeedTerm"):t("shamelaQueryHint"));
    $("#count").textContent=""; shQuery=null; return; }
  shQuery={groups,excludes}; shOffset=0; shLoaded=0;
  lastSearchTerms=groups.flat();     // für Lesezeichen-Hervorhebung
  $("#results").innerHTML=searchingBox(); $("#count").textContent=t("shamelaSearching");
  const res=await api().shamela_search(Object.assign({groups,excludes,limit:PAGE,offset:0},shamelaFilters()));
  showShamelaResults(res,false);
}
async function loadMoreShamela(){
  if(!shQuery)return;
  shOffset+=PAGE;
  const res=await api().shamela_search(Object.assign(
    {groups:shQuery.groups,excludes:shQuery.excludes,limit:PAGE,offset:shOffset},
    shamelaFilters()));
  showShamelaResults(res,true);
}
function showShamelaResults(res,append){
  const box=$("#results");
  const old=$("#loadMore"); if(old)old.remove();
  if(res&&res.error){ box.innerHTML=emptyBox(res.error); $("#count").textContent=""; return; }
  if(!append){ box.innerHTML=""; shLoaded=0; }
  const hits=res.hits||[];
  if(!append && !hits.length){ box.innerHTML=emptyBox(t("empty")); $("#count").textContent=""; return; }
  for(const h of hits){ box.appendChild(shamelaHitEl(h)); shLoaded++; }
  $("#count").textContent=shLoaded+" "+t("results")+(res.has_more?"+":"");
  if(res.has_more){
    const b=document.createElement("button");b.id="loadMore";b.className="btn sm";
    b.style.cssText="display:block;margin:16px auto 0;";
    b.textContent=t("loadMore");
    b.onclick=()=>{b.disabled=true;b.textContent=t("loading");loadMoreShamela();};
    box.appendChild(b);
  }
}
// Lesezeichen-Daten eines Online-Treffers. Die Identität eines Online-
// Lesezeichens ist book_id + page_str (siehe bmKeyOf), nicht eine lokale ID.
function shamelaBmData(h){
  return {source:"shamela",book_id:h.book_id,seq:h.seq,page_str:h.page,
          page_label:shamelaHitLabel(h),title:h.title,author:h.author,
          snippet:h.snippet,
          terms:(shQuery&&shQuery.groups?shQuery.groups.flat():[])};
}
function shamelaHitEl(h){
  const el=document.createElement("div");el.className="hit";
  const label=shamelaHitLabel(h);
  el.innerHTML=`
    <div class="top">

function hitEl(h){

// Begriffe der zuletzt AUSGEFÜHRTEN Suche – zuverlässiger als der Zustand
// zum Klickzeitpunkt (wird in runSearch gesetzt).
let lastSearchTerms=[];
// Komplette zuletzt ausgeführte Suchanfrage (Gruppen UND Ausschlüsse).
// Wichtig: Eine Suche kann auch nur aus Ausschlüssen bestehen – dann gibt es
// keine Begriffe, die Trefferliste im Leser muss trotzdem gefüllt werden.
let lastSearchQuery={groups:[],excludes:[]};
function currentTerms(){ return lastSearchTerms.slice(); }
// Übergabe vereinheitlichen: Array (nur Begriffe) oder {groups,excludes}
function normQuery(q){
  if(!q)return {groups:[],excludes:[]};
  if(Array.isArray(q))return {groups:q.length?[q.slice()]:[],excludes:[]};
  return {groups:(q.groups||[]).map(g=>g.slice()),excludes:(q.excludes||[]).slice()};
}

/* Bereits gesetzte Lesezeichen merken, damit das Symbol den Zustand zeigt
   und ein zweiter Klick das Lesezeichen wieder entfernt. */
let bmKeys=new Set();
function bmKey(doc,page,pid){ return doc+"|"+page+"|"+(pid||""); }
// Online-Lesezeichen werden über Buch- und Seitenkennung erkannt, nicht über
// lokale IDs (die es dort nicht gibt).
function bmKeyOf(b){
  return (b&&(b.source==="shamela"))
    ? "shx|"+b.book_id+"|"+(b.page_str||"")
    : bmKey(b.document_id,b.page_no,b.passage_id);
}
async function refreshBmKeys(){
  try{ const l=await api().bookmarks();
    bmKeys=new Set((l||[]).map(bmKeyOf)); }
  catch(e){}
}
// Einheitliches Umschalten für alle Lesezeichen-Knöpfe
async function toggleBookmark(btn,data){
  const r=await api().bookmark_toggle(data);
  if(r&&r.error){ showError(r.error); return; }
  const k=bmKeyOf(data);
  if(r.saved){ bmKeys.add(k); } else { bmKeys.delete(k); }
  if(btn)btn.classList.toggle("on",!!r.saved);
  // Dieselbe Stelle kann zugleich in der Trefferliste stehen – dort das
  // Symbol mitziehen, damit Liste und Leser nicht auseinanderlaufen.
  $$(".bmBtn[data-bmkey]").forEach(b=>{
    if(b!==btn&&b.dataset.bmkey===k)b.classList.toggle("on",!!r.saved);
  });
  showToast(r.saved?t("bmSaved"):t("bmRemoved"));
}
// Fällt die Liste leer aus, dienen die tatsächlich gefundenen Wortformen
// als Ersatz – so ist die Trefferliste im Leser nie leer.
function termsForReader(h){
  const t1=currentTerms();
  if(t1.length)return t1;
  return (h && h.matched_words) ? h.matched_words.slice() : [];
}
function showResults(res, append){
