/* ---------- Leser: durchgehender Lesefluss ---------- */
let rDoc=null,rPage=1,rFirst=1,rLast=1,rWords=[],rPassageText="",rImg=false,rHasImg=false;
let rTitleTxt="",rAuthorTxt="",rLoaded=new Set(),rHits=[],rHitIdx=-1,rFont=1,rReady=false;
// Remote-Leser (Shamela online): rRemote schaltet die Datenquelle um; rBook ist
// die book_id, rPageLabels bildet sequence_num -> lesbare Seitenangabe ab.
// rPageStrs merkt zusätzlich die Seitenkennung ("V01P441") je Blatt – nötig,
// um ein Online-Lesezeichen später wieder exakt aufzuschlagen.
let rRemote=false,rBook=null,rPageLabels={},rPageStrs={};
// Traegt das geoeffnete Buch echte Druckseiten? Bei lokalen Buechern
// aus dem Netz uebernommen: ja. Steuert nur die Beschriftung.
let rHasLabels=false;
// Roh-Text + Marker je geladener Seite zwischenspeichern, damit Umschalten
// (Vokalzeichen/Bild) ohne Server-Neuladen sofort neu darstellen kann.
let rPageText={},rPageSpans={};
let rHideTashkil=false;     // globaler Schalter: Vokalzeichen im Lesetext ausblenden
// Generationszähler für Reader-Navigation: jeder Sprung (Klick/Taste) erhöht
// ihn; veraltete, noch laufende Sprünge erkennen das und brechen ab (kein
// Verschränken bei schnellen Klicks).
let rNavGen=0;
// Prune-Zentrum während eines Sprungs: pruneFar behält [Zentrum±KEEP]. Beim
// Sprung ist das die Zielseite (sonst würde die frisch geladene Umgebung sofort
// wieder geleert), sonst die aktuelle Seite rPage.
let rCenter=null;
// Laufende Seiten-Anfragen (Promises). Vor einem Treffer-Sprung muss das
// Zielfenster wirklich GERENDERT sein – auch Seiten, die eine noch laufende
// frühere Anfrage nur beansprucht (rLoaded), aber noch nicht gefüllt hat.
// Sonst wächst eine Seite oberhalb des Ziels NACH dem Scroll und schiebt es weg.
let rInflight=new Set();
// Puffer: so viele Seiten werden im Voraus geladen, damit beim Weiterlesen
// nie gewartet werden muss. KEEP muss größer sein als der Puffer.
const BEHIND=3, AHEAD=10, KEEP=60;
// --- Fenster-Rendering ----------------------------------------------------
// Es existieren immer nur ~2*HALF+1 echte Blätter im DOM, egal wie dick das
// Buch ist. Ober- und unterhalb steht je ein Platzhalter mit berechneter Höhe,
// damit Scrollbalken und Scrollpositionen stimmen. Früher wurde für JEDE
// Buchseite ein Knoten angelegt (bei 8.000 Seiten 8.000 Knoten) und ferne
// Blätter nur geleert – auf schwächeren Geräten unbenutzbar.
const HALF=20;          // Fensterradius in Seiten
const RAND=6;           // so nah am Fensterrand wird nachgeschoben
const GAP=30;           // margin-bottom der .pageSheet – gehört zur Höhe
let rWinFrom=1,rWinTo=0;        // aktuell gerendertes Fenster
let rHeights={};                // gemessene Höhen je Seite
let rAvgH=600;                  // Schätzwert für noch nie gemessene Seiten
let rMessungen=0,rMessSumme=0;  // laufender Mittelwert
let rPrefix=null,rPrefixAlt=true;   // Präfixsummen der Höhen (für Offsets)

function pageH(p){const h=rHeights[p];return (h&&h>0)?h:rAvgH;}
function prefixNeu(){
  const n=Math.max(0,rLast-rFirst+1);
  rPrefix=new Float64Array(n+1);
  for(let i=1;i<=n;i++)rPrefix[i]=rPrefix[i-1]+pageH(rFirst+i-1);
  rPrefixAlt=false;
}
// y-Position der Oberkante von Seite p im gedachten Gesamtdokument
function offsetOf(p){
  if(rPrefixAlt)prefixNeu();
  const i=Math.max(0,Math.min(rPrefix.length-1,(p|0)-rFirst));
  return rPrefix[i];
}
function totalH(){ if(rPrefixAlt)prefixNeu(); return rPrefix[rPrefix.length-1]; }
// Browser begrenzen die Höhe eines Elements (WebKit/Chromium: 2^25 px). Ein
// Buch mit 63.000 Seiten bräuchte ~70 Mio. px – die Platzhalter würden
// abgeschnitten und jede Offset-Rechnung ginge daneben. Deshalb wird die
// Bildlaufhöhe gestaucht; innerhalb des Fensters gilt weiter die echte Höhe.
const MAXH=20000000;
function skala(){const t=totalH();return t>MAXH?MAXH/t:1;}
function vOff(p){return offsetOf(p)*skala();}
function vTotal(){return Math.min(totalH(),MAXH);}
// Welche Seite liegt bei dieser Scrollhöhe? (Binärsuche über die Präfixsummen)
function pageAtOffset(y){
  if(rPrefixAlt)prefixNeu();
  let lo=0,hi=rPrefix.length-2;
  if(hi<0)return rFirst;
  while(lo<hi){const m=(lo+hi+1)>>1; if(rPrefix[m]<=y)lo=m; else hi=m-1;}
  return rFirst+lo;
}
// Ein Blatt erzeugen (noch ungefüllt, mit geschätzter Höhe als Platzhalter)
function makeSheet(p){
  const s=document.createElement("div");
  s.className="pageSheet loading";s.id="pg"+p;s.dataset.page=p;
  // Bücher mit Druckseiten zeigen erst "…", bis sie bekannt ist – sonst
  // stünde dort kurz "Seite 5" und spränge dann auf "ج1 ص441" um.
  const lbl=rPageLabels[p]||((rRemote||rHasLabels)?"…":`${esc(t("pagePrefix"))} ${p}`);
  s.innerHTML=`<div class="pageNum">${lbl}</div>`
    +`<div class="pageText" dir="auto"><span class="ring sm" style="margin:14px auto"></span></div>`;
  s.style.minHeight=Math.max(40,pageH(p)-GAP)+"px";
  return s;
}
// Gemessene Höhen der gerenderten Blätter ins Modell übernehmen
function measureWindow(){
  let geaendert=false;
  for(let p=rWinFrom;p<=rWinTo;p++){
    const s=sheetOf(p);if(!s||s.classList.contains("loading"))continue;
    const h=s.offsetHeight+GAP;
    if(h>0&&Math.abs((rHeights[p]||0)-h)>1){
      if(!rHeights[p]){rMessungen++;rMessSumme+=h;}
      else{rMessSumme+=h-rHeights[p];}
      rHeights[p]=h;geaendert=true;
    }
  }
  if(geaendert){
    if(rMessungen>0)rAvgH=Math.max(120,rMessSumme/rMessungen);
    rPrefixAlt=true;
  }
  return geaendert;
}
// Platzhalterhöhen nachziehen; optional die Scrollposition an einer Seite
// verankern, damit gemessene Höhenänderungen nichts verschieben.
function syncSpacers(){
  const oben=document.getElementById("rSpacerTop");
  const unten=document.getElementById("rSpacerBot");
  if(oben)oben.style.height=vOff(rWinFrom)+"px";
  if(unten)unten.style.height=Math.max(0,vTotal()-vOff(rWinTo+1))+"px";
}
// Bildschirmposition eines Blatts relativ zum Lesebereich (exakt, am DOM).
function sheetY(p){
  const s=sheetOf(p);if(!s)return null;
  const box=$("#rReading");
  return s.getBoundingClientRect().top-box.getBoundingClientRect().top;
}
// Fenster um `center` aufbauen. Gibt false zurück, wenn es schon passt.
function buildWindow(center,erzwingen){
  center=Math.min(rLast,Math.max(rFirst,(center|0)||rFirst));
  const von=Math.max(rFirst,center-HALF), bis=Math.min(rLast,center+HALF);
  if(!erzwingen&&von===rWinFrom&&bis===rWinTo)return false;
  const box=$("#rReading");
  box.innerHTML="";
  const frag=document.createDocumentFragment();
  const oben=document.createElement("div");
  oben.id="rSpacerTop";oben.className="pageSpacer";
  frag.appendChild(oben);
  for(let p=von;p<=bis;p++)frag.appendChild(makeSheet(p));
  const unten=document.createElement("div");
  unten.id="rSpacerBot";unten.className="pageSpacer";
  frag.appendChild(unten);
  box.appendChild(frag);
  rWinFrom=von;rWinTo=bis;
  // Was schon im Textspeicher liegt, sofort darstellen (kein Nachladen nötig)
  for(let p=von;p<=bis;p++)if(rPageText[p]!=null)fillSheet(p,rPageText[p],rPageSpans[p]||null);
  measureWindow();
  syncSpacers();
  return true;
}
// Fenster nachschieben, ohne dass die Ansicht springt
function slideWindow(center){
  const box=$("#rReading");
  const anker=visiblePage(rPage);
  const vorher=sheetY(anker);              // wo steht die Seite gerade?
  if(!buildWindow(center))return false;
  const nachher=sheetY(anker);
  // Dieselbe Seite wieder an dieselbe Stelle bringen – ohne Modellrechnung,
  // damit Schätzfehler in den Höhen nichts verschieben.
  if(vorher!=null&&nachher!=null)box.scrollTop+=(nachher-vorher);
  else box.scrollTop=vOff(center);
  return true;
}
// Liegt die Seite zu nah am Fensterrand? Dann nachschieben.
function ensureWindow(p){
  if(p<rWinFrom+RAND||p>rWinTo-RAND){
    if(rWinFrom>rFirst||rWinTo<rLast)return slideWindow(p);
  }
  return false;
}
function setTotalLabel(){
  $("#rPageTotal").textContent=rRemote?`/ ${rLast-rFirst+1}`:`/ ${rLast}`;
}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function passageRe(p){const parts=p.trim().split(/\s+/).map(escRe);if(!parts.length)return null;try{return new RegExp(parts.join("\\s+"));}catch(e){return null;}}
const sheetOf=p=>document.getElementById("pg"+p);

async function openReader(docId,passageId,words,terms){
  rRemote=false;rBook=null;setReaderRemoteUI(false);
  rDoc=docId;rWords=words||[];rImg=false;rPassageText="";rReady=false;
  rLoaded=new Set();rHits=[];rHitIdx=-1;
  // Vollständige Suchanfrage übernehmen (Gruppen + Ausschlüsse). Fehlen
  // Begriffe, dienen ersatzweise die gefundenen Wortformen.
  const q=normQuery(terms);
  if(!q.groups.length && words && words.length) q.groups=[words.slice()];
  readerState.groups=q.groups.length?q.groups:[[]];
  readerState.excludes=q.excludes;
  readerState.excludeOpen=q.excludes.length>0;
  $("#rExcludeArea").style.display=q.excludes.length?"":"none";
  renderPanel(READER);
  // Auch ohne Begriffe suchen, wenn aus einem Treffer geöffnet – dann
  // listet der Leser die Stellen dieses Buches (wie in der Hauptsuche).
  const doSearch=!!(q.groups.length||q.excludes.length||passageId);
  $("#rHitNav").style.display="none";
  $("#reader").classList.add("open");
  $("#rReading").innerHTML=readerLoadingBox();   // sichtbar: Buch wird geladen
  const meta=await api().document(docId);
  rTitleTxt=meta.title||"";
  $("#rTitle").textContent=rTitleTxt;
  $("#rAuthor").textContent=meta.author?authorText(meta.author):"";
  rHasImg=false;
  const info=await api().pages(docId,1,1);
  rFirst=info.first_page||1;rLast=info.last_page||1;
  buildSheets();
  applyFont(rFont);
  updateTashkilBtn();
  // Startseite: Treffer > gemerkte Leseposition > erste Seite
  let start=rFirst;
  if(passageId){
    try{const p=await api().passage(passageId);
      if(!p.error){rPassageText=p.text||"";start=p.page_from||start;}}catch(e){}
  }else{
    try{const m=await api().meta_get("pos:"+docId);const n=parseInt(m.value||"",10);
      if(n>=rFirst&&n<=rLast)start=n;}catch(e){}
  }
  showReaderHint();
  // Trefferliste zuerst füllen – unabhängig davon, ob das Blättern klappt
  if(doSearch){ try{ await runReaderSearch(false,true); }catch(e){} }
  // Zur angeklickten Fundstelle springen (nicht zum ersten Treffer)
  let jumped=false;
  if(passageId&&rHits.length){
    const i=rHits.findIndex(h=>h.passage_id===passageId);
    if(i>=0){ try{ await selectHit(i); jumped=true; }catch(e){} }
  }
  if(!jumped){ try{ await gotoPage(start,false); }catch(e){} }
  rReady=true;
  updateBookmarkBtn();
}
function closeReader(){$("#reader").classList.remove("open");hideCite();}

// Blendet leserinterne Steuerelemente aus, die es im Remote-Modus (noch) nicht
// gibt: Lesezeichen und die Originalseiten-Ansicht (Shamela liefert nur Text).
function setReaderRemoteUI(remote){
  // Lesezeichen gibt es jetzt auch für Online-Bücher; nur die Bildansicht
  // bleibt aus (Originalseiten liegen nicht auf diesem Rechner).
  const img=$("#rImgToggle"); if(img)img.style.display=remote?"none":"";
  // Übernehmen gibt es nur online – ein bereits lokales Buch ist ja da.
  const dl=$("#rDownloadBook"); if(dl)dl.style.display=remote?"":"none";
}

// Leser für ein Online-Buch der Shamela öffnen. hit trägt book_id + page
// (die Seitenkennung, z. B. "V01P441"); die interne Blattnummer bestimmt der
// Server beim Öffnen. Fehlt eine der beiden Angaben, lässt sich das Buch nicht
// aufschlagen – dann eine verständliche Meldung statt eines Absturzes.
async function openShamelaReader(hit){
  if(!hit||hit.book_id==null||(hit.seq==null&&!hit.page)){
    showError(t("shOpenFail"));return;
  }
  rRemote=true;rBook=hit.book_id;rDoc="shx:"+hit.book_id;
  rImg=false;rHasImg=false;rPassageText="";rReady=false;
  rLoaded=new Set();rHits=[];rHitIdx=-1;rPageLabels={};rPageStrs={};rPageText={};rPageSpans={};rHasLabels=false;
  setReaderRemoteUI(true);
  // Vollständige Suchanfrage übernehmen (Gruppen + Ausschlüsse) – wie bei
  // einem lokalen Buch, damit ODER-Gruppe und Ausschluss auch im Online-Leser
  // stehen bleiben und die Suche im Buch dasselbe findet wie die Trefferliste.
  const q=normQuery(hit._query);
  rWords=q.groups.flat().filter(Boolean);
  readerState.groups=q.groups.length?q.groups:[[]];
  readerState.excludes=q.excludes;
  readerState.excludeOpen=q.excludes.length>0;
  $("#rExcludeArea").style.display=q.excludes.length?"":"none";
  renderPanel(READER);
  $("#rHitNav").style.display="none";
  $("#reader").classList.add("open");
  $("#rTitle").innerHTML=esc(hit.title||"")+`<span class="onlineBadge">${esc(t("onlineTag"))}</span>`;
  rTitleTxt=hit.title||"";
  rAuthorTxt=hit.author||"";
  $("#rAuthor").textContent=hit.author||"";
  $("#rReading").innerHTML=readerLoadingBox();   // sichtbar: Buch wird geladen
  // Erste Seite laden: liefert die Grenzen (first_seq/last_seq) des Buches und
  // die Blattnummer der gesuchten Seite. Beim ersten Öffnen eines Buches baut
  // der Server dessen Seitenverzeichnis auf – das darf etwas dauern.
  const info=await api().shamela_page({book_id:hit.book_id,seq:hit.seq,
      page:hit.page,title:hit.title,author:hit.author,before:0,after:0,
      terms:readerTerms()});
  if(!info||info.error){ showError((info&&info.error)||t("shOpenFail"));
    closeReader(); return; }
  const openSeq=info.seq||hit.seq||info.first_seq||1;
  rFirst=info.first_seq||1;rLast=info.last_seq||openSeq;
  buildSheets();
  applyFont(rFont);
  updateTashkilBtn();
  showReaderHint();
  try{ await gotoPage(openSeq,false); }catch(e){}
  // Verwandte Stellen dieses Buches auflisten (Treffer-Navigation), ohne von
  // der aufgeschlagenen Seite wegzuspringen.
  if(q){ try{ await runReaderSearch(false,true); }catch(e){} }
  // Den aufgeschlagenen Treffer in der Liste hervorheben – wie lokal, wo
  // openReader dafür selectHit ruft. Gesucht wird über die Seitenkennung
  // (die Blattnummer kennen die Treffer anfangs nicht).
  if(rHits.length){
    let i=rHits.findIndex(x=>(x.page_str||x.page)&&(x.page_str||x.page)===hit.page);
    if(i<0&&Number.isInteger(openSeq))i=rHits.findIndex(x=>x.seq===openSeq);
    if(i>=0){ try{ await selectHit(i); }catch(e){} }
  }
  rReady=true;
  updateBookmarkBtn();
}

// Leser neu aufsetzen: Höhenmodell zurücksetzen und das erste Fenster bauen.
function buildSheets(start){
  rHeights={};rAvgH=600;rMessungen=0;rMessSumme=0;rPrefixAlt=true;
  rWinFrom=1;rWinTo=0;
  buildWindow(start!=null?start:rFirst,true);
  setTotalLabel();
}

// Seitenlabel eines Blatts nachträglich setzen (Remote: nach dem Laden bekannt)
function setSheetLabel(seq,label){
  const s=sheetOf(seq);if(!s)return;
  const n=s.querySelector(".pageNum");if(n)n.textContent=label||"…";
}
// Lesbare Seitenangabe für eine Shamela-Seite: „ج2 ص45" bzw. „ص45".
// EINE Beschriftung fuer Trefferliste und Leser. Beide Stellen hatten bisher
// je eine eigene, wortgleiche Fassung – zwei Kopien derselben Regel, die
// auseinanderlaufen koennen, ohne dass es auffaellt. Genau das waere der
// schlimmste Fall: dieselbe Fundstelle mit zwei verschiedenen Seitenangaben,
// und der Nutzer sieht nicht, welche stimmt.
//
// Regel: Band = `part`, Seite = `page_num`, beide unveraendert aus der
// Seitenkennung der Quelle dekodiert (V57P011 = Band 57, Seite 11). Fehlt die
// Seitennummer, wird die Rohkennung gezeigt – lieber die als gar nichts.
function shamelaLabel(part,num,ersatz){
  const n=(num!=null&&num!=="")?num:ersatz;
  if(n==null||n==="")return null;
  const b=(part!=null&&String(part).trim()!=="")?String(part).trim():"";
  return b?`ج${b} ص${n}`:`ص${n}`;
}
function shamelaPageLabel(pg){
  return shamelaLabel(pg.part,pg.page_num,pg.page_str)||"…";
}

// Aktive Include-Begriffe des Lesers (für wurzelbewusste Server-Markierung)
function readerTerms(){return (readerState.groups||[]).flat().filter(Boolean);}

// Fallback: geerntete Wortformen literal im Text finden (nur ohne Server-Spans)
function wordSpans(text,words){
  const out=[];
  for(const w of (words||[])){
    if(!w)continue;
    let from=0,idx;
    while((idx=text.indexOf(w,from))>=0){out.push([idx,idx+w.length]);from=idx+w.length;}
  }
  return out;
}

// Setzt Seitentext + Markierungen (Zeichen-Offsets) + optionalen Passagenkasten
// in EINEM Durchlauf zusammen. Markierungen liegen wortweise und stets ganz
// innerhalb oder ganz außerhalb der Passagenregion → korrekte Verschachtelung.
// Arabische Vokalzeichen (Tashkil) + Tatweel – spiegelt _TASHKIL aus
// engine/echo_engine/normalize.py. Wird beim Anzeigen (nicht beim Suchen) genutzt.
const TASHKIL=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
function stripTashkil(s){return (s||"").replace(TASHKIL,"");}
// Anzeige-Filter: blendet Vokalzeichen aus, wenn der globale Schalter aktiv ist.
const disp=s=>rHideTashkil?stripTashkil(s):s;

function stitchMarks(text,spans,boxStart,boxEnd){
  let marks=(spans||[]).filter(s=>s&&s[1]>s[0]).sort((a,b)=>a[0]-b[0]);
  const merged=[];
  for(const s of marks){const last=merged[merged.length-1];
    if(last&&s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else merged.push([s[0],s[1]]);}
  const ev=[];
  for(const [a,b] of merged){ev.push({pos:a,rank:4,str:"<mark>"});ev.push({pos:b,rank:1,str:"</mark>"});}
  if(boxStart!=null&&boxEnd!=null&&boxEnd>boxStart){
    ev.push({pos:boxStart,rank:3,str:'<span class="passageBox">'});
    ev.push({pos:boxEnd,rank:2,str:"</span>"});
  }
  // gleiche Position: erst schließen (mark<box), dann öffnen (box<mark)
  ev.sort((a,b)=>a.pos-b.pos||a.rank-b.rank);
  // Wichtig: an den ORIGINAL-Positionen schneiden, Vokalzeichen erst INNERHALB
  // der Stücke entfernen (disp) – so verrutscht keine Markierung.
  let out="",cur=0;
  for(const e of ev){if(e.pos>cur){out+=esc(disp(text.slice(cur,e.pos)));cur=e.pos;}out+=e.str;}
  out+=esc(disp(text.slice(cur)));
  return out;
}

// Seiteninhalt rendern (Text oder Originalbild), inkl. Hervorhebung.
// spans = wurzelbewusst serverseitig gegen DIESEN Seitentext berechnet.
function fillSheet(pageNo,text,spans){
  const s=sheetOf(pageNo);if(!s)return;
  const body=s.querySelector(".pageText");
  if(rImg&&rHasImg){
    body.innerHTML=`<img loading="lazy" src="/api/page_image?doc=${rDoc}&page=${pageNo}" alt="">`;
  }else{
    text=text||"";
    const re=rPassageText?passageRe(rPassageText):null;
    const m=re?re.exec(text):null;
    let marks=(spans&&spans.length)?spans:(rWords.length?wordSpans(text,rWords):[]);
    body.innerHTML=stitchMarks(text,marks,m?m.index:null,m?m.index+m[0].length:null)||"—";
  }
  s.style.minHeight="";   // reservierte Platzhalterhöhe freigeben (echte Höhe)
  s.classList.remove("loading");
}

async function ensurePages(from,to){
  from=Math.max(rFirst,from);to=Math.min(rLast,to);
  const need=[];for(let p=from;p<=to;p++)if(!rLoaded.has(p))need.push(p);
  if(!need.length)return;
  const a=need[0],b=need[need.length-1];
  need.forEach(p=>rLoaded.add(p));      // doppelte Anfragen vermeiden
  // Remote (Shamela): Seiten per sequence_num vom Server holen. Der Server
  // liefert /page mit seq=a und after=(b-a), also den ganzen Bereich auf einmal.
  // Die Marker rechnet die App aus (wurzelbewusst, wie bei lokalen Büchern) –
  // dafür gehen die Suchbegriffe mit; sonst griffe nur ein wörtlicher
  // Vergleich, der Vokalzeichen und Beugungen verfehlt.
  const job=(rRemote
      ? api().shamela_page({book_id:rBook,seq:a,before:0,after:b-a,
                            title:rTitleTxt,author:rAuthorTxt,
                            terms:readerTerms()}).then(res=>{
          if(res&&res.error){need.forEach(p=>rLoaded.delete(p));return;}
          for(const pg of (res.pages||[])){
            if(pg.page_label==null) pg.page_label=shamelaPageLabel(pg);
            rPageLabels[pg.seq]=pg.page_label;
            rPageStrs[pg.seq]=pg.page_str||"";
            rPageText[pg.seq]=pg.text||"";rPageSpans[pg.seq]=pg.spans||null;
            setSheetLabel(pg.seq,pg.page_label);
            fillSheet(pg.seq,pg.text,pg.spans||null);
          }
          updateBookmarkBtn();})
      : api().pages(rDoc,a,b,readerTerms())
          .then(res=>{if(res.has_labels)rHasLabels=true;
            for(const pg of (res.pages||[])){
            rPageText[pg.page_no]=pg.text||"";rPageSpans[pg.page_no]=pg.spans||null;
            if(pg.page_label){rPageLabels[pg.page_no]=pg.page_label;setSheetLabel(pg.page_no,pg.page_label);}
            fillSheet(pg.page_no,pg.text,pg.spans);}}))
    .catch(()=>{need.forEach(p=>rLoaded.delete(p));});
  rInflight.add(job);
  try{ await job; } finally{
    rInflight.delete(job);
    // Neu gefüllte Blätter haben ihre echte Höhe – Modell und Platzhalter
    // nachziehen, an der aktuellen Seite verankert (keine Positions-Drift).
    const box=$("#rReading");
    const anker=visiblePage(rPage);
    const vorher=sheetY(anker);
    if(measureWindow()){
      syncSpacers();
      const nachher=sheetY(anker);
      if(vorher!=null&&nachher!=null)box.scrollTop+=(nachher-vorher);
    }
    pruneFar();
  }
}
// Prüft, ob im Fenster noch eine Seite ungefüllt ("…") ist.
function windowHasLoading(from,to){
  for(let p=from;p<=to;p++){const s=sheetOf(p);
    if(s&&s.classList.contains("loading"))return true;}
  return false;
}
// Lädt das Fenster und wartet, bis es WIRKLICH gerendert ist – inkl. Seiten,
// die eine andere, noch laufende Anfrage beansprucht hat. Ohne das kann eine
// Seite oberhalb des Ziels nach dem Scroll nachwachsen (zweimal-klicken-Bug).
async function ensureWindowFilled(from,to,gen){
  from=Math.max(rFirst,from);to=Math.min(rLast,to);
  await ensurePages(from,to);
  if(gen!==rNavGen)return;
  let guard=0;
  while(guard++<4 && windowHasLoading(from,to) && rInflight.size){
    await Promise.all([...rInflight]);
    if(gen!==rNavGen)return;
    await ensurePages(from,to);   // durch Fehler Freigewordenes nachladen
    if(gen!==rNavGen)return;
  }
}
// Weit entfernte Seiten aus dem Textspeicher nehmen. Die DOM-Knoten regelt
// jetzt das Fenster – außerhalb existieren gar keine. Die gemessenen Höhen
// bleiben erhalten, damit Scrollbalken und Sprungziele stimmen.
function pruneFar(){
  const center=(rCenter!=null?rCenter:rPage);
  for(const p of [...rLoaded]){
    if(Math.abs(p-center)>KEEP){
      rLoaded.delete(p);
      delete rPageText[p]; delete rPageSpans[p];
    }
  }
}

// Puffer im Hintergrund füllen (ohne zu blockieren)
function prefetch(around){ ensurePages(around-BEHIND, around+AHEAD); }

// Findet ab Seite `from` vorwärts (über die Passagenspanne) die erste Marke –
// bevorzugt den Passagenkasten, sonst ein hervorgehobenes Wort. So landet man
// auch dann auf dem Treffer, wenn er erst auf page_to (der Folgeseite) steht.
function firstHitTarget(from,to){
  for(let p=from;p<=to;p++){
    const s=sheetOf(p);if(!s)continue;
    const el=s.querySelector(".passageBox")||s.querySelector("mark");
    if(el)return {el,page:p};
  }
  return null;
}

async function gotoPage(n,smooth=true,hit=false,gen,toPage){
  if(gen==null)gen=++rNavGen;          // eigenständiger Nav-Einstieg = neueste Nav
  // Ohne gültige Blattnummer nicht blättern. Früher wurde daraus über n|0
  // stillschweigend 0 und damit die erste Seite – ein Sprung ans Buchanfang,
  // der wie ein Fehler beim Weiterklicken aussah.
  const ziel=(typeof n==="number")?Math.trunc(n):parseInt(n,10);
  if(!Number.isFinite(ziel)){ return; }
  n=Math.min(rLast,Math.max(rFirst,ziel));
  // Prune um die Zielseite zentrieren, damit die frisch geladene Umgebung nicht
  // sofort wieder geleert wird (sonst Sprung auf ein leeres Sheet).
  rCenter=n;
  // Erst das Fenster auf die Zielseite legen – nur dort existieren Knoten.
  buildWindow(n);
  try{
    // Ganzes Puffer-Fenster VOR dem Scrollen laden UND auf das tatsächliche
    // Rendern warten, damit sich das Layout oberhalb des Ziels danach nicht
    // mehr verschiebt.
    await ensureWindowFilled(n-BEHIND,n+AHEAD,gen);
  }finally{ rCenter=null; }
  if(gen!==rNavGen)return;              // ein neuerer Sprung hat übernommen
  // Gemessene Höhen übernehmen und die Platzhalter nachziehen, BEVOR gescrollt
  // wird – sonst zielt der Sprung auf eine veraltete Position.
  measureWindow(); syncSpacers();
  let scrollPage=n,target=sheetOf(n),block="start";
  if(hit){
    // Nur innerhalb der Passagenspanne suchen (nicht auf Rest-Markierungen
    // späterer Seiten aus einem früheren Treffer springen).
    const end=Math.min(rLast,Math.max(n,toPage||n));
    const found=firstHitTarget(n,end);
    if(found){target=found.el;scrollPage=found.page;block="center";}
  }
  if(target){
    // Immer ohne Animation direkt auf die Seite (Research-Tool, kein Scroll-
    // Theater wie in Acrobat). Verhindert zugleich das „wilde Springen": während
    // einer Animation meldete die Scroll-Erkennung Zwischenseiten, von denen der
    // nächste Tastendruck dann falsch weiterrechnete.
    target.scrollIntoView({block,behavior:"auto"});
    // S-3: Das programmatische Scrollen löst gleich ein Scroll-Event aus. Bei
    // einem zentrierten Treffer (block:"center") liegt die Blattoberkante über
    // der 60px-Ableselinie, sodass visiblePage die Seite DAVOR meldete und die
    // Kopfzeile fälschlich um 1 zu niedrig setzte. Dieses eine Auto-Event kurz
    // ignorieren; sobald der Nutzer selbst scrollt, greift wieder alles normal.
    rJumpAt=performance.now();
  }
  setCurrentPage(scrollPage);
}
function setCurrentPage(n){
  if(n===rPage&&$("#rPageInput").value)return;
  rPage=n;
  const inp=$("#rPageInput");
  // Remote: das Eingabefeld zeigt die fortlaufende Position (1..N), nicht die
  // interne sequence_num – passend zur Gesamtzahl „/ N".
  if(document.activeElement!==inp)inp.value=rRemote?(n-rFirst+1):n;
  const span=rLast-rFirst||1;
  $("#rProgressBar").style.width=(((n-rFirst)/span)*100).toFixed(1)+"%";
  $$("#rReading .pageSheet.current").forEach(x=>x.classList.remove("current"));
  const s=sheetOf(n);if(s)s.classList.add("current");
  saveReadPos(n);
  if(typeof updateBookmarkBtn==="function")updateBookmarkBtn();
}
let _posT=null;
function saveReadPos(n){
  if(!rReady||!rDoc)return;
  clearTimeout(_posT);
  _posT=setTimeout(()=>{try{api().meta_set("pos:"+rDoc,String(n));}catch(e){}},900);
}

// Oberste sichtbare Seite bestimmen. Die Blätter stehen in Seitenreihenfolge
// untereinander, ihre Unterkanten steigen also monoton – deshalb genügt eine
// binäre Suche. Der frühere Durchlauf über ALLE Blätter kostete bei einem
// Buch mit 8.765 Seiten spürbar Rechenzeit bei jedem Scrollen (gemessen in
// WKWebView: 1,50 ms gegenüber jetzt unter der Messgrenze).
function visiblePage(fallback){
  const box=$("#rReading");
  if(rLast<rFirst)return fallback;
  const grenze=box.getBoundingClientRect().top+60;
  // Im Fenster (nur ~40 Knoten) exakt am DOM ablesen …
  for(let p=rWinFrom;p<=rWinTo;p++){
    const s=sheetOf(p);if(!s)continue;
    if(s.getBoundingClientRect().bottom>grenze)return p;
  }
  // … außerhalb (nach einem weiten Sprung) über das Modell schätzen.
  const f=skala();
  return pageAtOffset((box.scrollTop+60)/(f||1));
}
// Sichtbare Seite ermitteln + nachladen
let _scrollT=null, rJumpAt=0;
$("#rReading").addEventListener("scroll",()=>{
  clearTimeout(_scrollT);
  _scrollT=setTimeout(()=>{
    const cur=visiblePage(rPage);
    ensureWindow(cur);          // Fenster mitführen (Knotenzahl bleibt klein)
    // Das unmittelbar nach einem Sprung ausgelöste Auto-Scroll-Event NICHT die
    // eben gesetzte Zielseite überschreiben lassen (S-3). Fenster/Prefetch
    // laufen trotzdem. Ein echter Nutzer-Scroll später liegt außerhalb dieses
    // kurzen Fensters und aktualisiert die Seite normal.
    if(performance.now()-rJumpAt>=260) setCurrentPage(cur);
    prefetch(cur);
  },90);
},{passive:true});

function showReaderHint(){
  $("#rResults").innerHTML=`<div class="empty" style="padding:40px 16px">`
    +svg("search")+`<div>${esc(t("readerSearchPrompt"))}</div></div>`;
}

async function runReaderSearch(autoSelect=true,force=false){
  const { groups, excludes } = collectPanel(READER);
  // Ohne Begriffe normalerweise nur der Hinweis – beim Öffnen aus einem
  // Treffer (force) wird trotzdem gelistet, was in diesem Buch steht.
  if(!groups.length && !excludes.length && !force){
    showReaderHint();rHits=[];updateHitNav();return; }
  let res;
  if(rRemote){
    // Auch im Online-Leser gehen die Pillen strukturiert hinaus – ODER-Gruppe
    // und Ausschluss wirken hier genauso wie in einem lokalen Buch.
    if(!groups.length){ showReaderHint();rHits=[];updateHitNav();return; }
    const sem=$("#semantic");
    const r=await api().shamela_search({groups,excludes,limit:100,book_ids:[rBook],
      semantic:sem?!!sem.checked:true});
    if(r&&r.error){ showError(r.error); rHits=[];updateHitNav(); return; }
    const terme=groups.flat();
    res={hits:(r.hits||[]).map(h=>shamelaToReaderHit(h,terme))};
  }else{
    res=await api().search_terms(groups, excludes, null, rDoc, 0, 200);
  }
  // Trefferliste in Buchreihenfolge statt nach Ähnlichkeit/Relevanz.
  rHits=sortHitsByPage(res.hits||[]);rHitIdx=-1;
  renderReaderHits({hits:rHits});
  updateHitNav();
  if(autoSelect&&rHits.length)selectHit(0);
}
// Shamela-Treffer in das Trefferformat des Lesers übersetzen: die
// sequence_num wird zur „Seite" (page_from=page_to=seq); `terme` sind die
// positiven Pillen und dienen als Wortformen für die Hervorhebung.
function shamelaToReaderHit(h,terme){
  // Online-Treffer tragen keine Blattnummer (der Server liefert seq:null) –
  // die Seitenkennung `page` wird deshalb mitgeführt und beim Anklicken in
  // eine Blattnummer aufgelöst (siehe selectHit).
  return {title:h.title,author:h.author,snippet:h.snippet||"",
    matched_words:(terme||[]).slice(),page_from:h.seq,page_to:h.seq,
    page_label:shamelaHitLabel(h),passage_id:null,
    book_id:h.book_id,seq:h.seq,page:h.page,page_str:h.page,
    part:h.part,page_num:h.page_num,snippet_spans:h.snippet_spans,
    reliability:"exact"};
}
// Sortierschlüssel eines Treffers für die Reihenfolge im Buch. Online steht
// die Druckseite in part/page_num (aus der Seitenkennung "V01P441"), offline
// ist es schlicht page_from. Zahlen fehlen -> ans Ende, aber stabil.
function hitPageKey(h){
  const pg=h.page_str||h.page;
  if(pg){                       // Online: nach Band + Druckseite
    const part=parseInt(h.part,10), num=parseInt(h.page_num,10);
    if(Number.isFinite(num))return [0,Number.isFinite(part)?part:0,num,""];
    return [1,0,0,String(pg)];  // unbekanntes Format: ans Ende, aber stabil
  }
  if(Number.isFinite(h.page_from))return [0,0,h.page_from,""];   // Offline
  return [1,0,0,""];
}
function sortHitsByPage(hits){
  // Reihenfolge im Buch statt nach Ähnlichkeit/Relevanz – so liest sich die
  // Trefferliste wie das Buch selbst (380, 381 …).
  return hits.slice().sort((a,b)=>{
    const x=hitPageKey(a),y=hitPageKey(b);
    for(let i=0;i<3;i++){ if(x[i]!==y[i])return x[i]-y[i]; }
    return x[3]<y[3]?-1:(x[3]>y[3]?1:0);
  });
}
function shamelaHitLabel(h){
  return shamelaLabel(h.part,h.page_num,h.page);
}
function updateHitNav(){
  const nav=$("#rHitNav");
  nav.style.display=rHits.length?"inline-flex":"none";
  $("#rHitCount").textContent=rHits.length?`${rHitIdx+1} / ${rHits.length}`:"";
}
// Blattnummer eines Online-Treffers besorgen. Der Suchdienst kennt sie nicht;
// sie steht im Seitenverzeichnis des Buches, das /page mitliefert. Einmal
// aufgelöst, bleibt sie am Treffer hängen.
async function ensureRemoteSeq(h){
  if(Number.isInteger(h.seq))return h.seq;
  const pg=h.page_str||h.page;
  if(!pg)return null;
  try{
    const info=await api().shamela_page({book_id:h.book_id||rBook,page:pg,
      title:rTitleTxt,author:rAuthorTxt,before:0,after:0});
    if(info&&!info.error&&Number.isInteger(info.seq)){
      h.seq=info.seq;h.page_from=info.seq;h.page_to=info.seq;
      return info.seq;
    }
  }catch(e){}
  return null;
}
async function selectHit(i){
  if(!rHits.length)return;
  const gen=++rNavGen;                   // dieser Klick ist jetzt der neueste
  rHitIdx=(i+rHits.length)%rHits.length;
  const h=rHits[rHitIdx];
  $$("#rResults .rHit").forEach((x,n)=>x.classList.toggle("active",n===rHitIdx));
  const act=$$("#rResults .rHit")[rHitIdx];
  if(act)act.scrollIntoView({block:"nearest"});
  rWords=h.matched_words||[];rPassageText="";
  if(h.passage_id){const p=await api().passage(h.passage_id);if(!p.error)rPassageText=p.text||"";}
  if(rRemote&&!Number.isInteger(h.page_from)){
    const s=await ensureRemoteSeq(h);
    if(gen!==rNavGen)return;
    if(!Number.isInteger(s)){ showError(t("shOpenFail")); return; }
  }
  if(gen!==rNavGen)return;                // ein neuerer Klick hat übernommen
  // Ganze Passagenspanne neu rendern lassen (die Flexion kann auf page_to
  // liegen), damit dort tatsächlich markiert wird.
  const pt=h.page_to||h.page_from;
  for(let p=h.page_from;p<=pt;p++)rLoaded.delete(p);
  await gotoPage(h.page_from,false,true,gen,pt);
  updateHitNav();
}
function renderReaderHits(res){
  const box=$("#rResults");box.innerHTML="";
  if(!res.hits.length){box.innerHTML=`<div class="empty" style="padding:30px 12px">${esc(t("empty"))}</div>`;return;}
  res.hits.forEach((h,i)=>{
    const el=document.createElement("div");el.className="rHit";
    const pg=h.page_label?esc(h.page_label)
      :(h.page_from===h.page_to?`${t("pagePrefix")} ${h.page_from}`:`${t("pagePrefix")} ${h.page_from}–${h.page_to}`);
    // Remote: (noch) keine Lesezeichen – Fähnchen weglassen.
    const bmHtml=rRemote?"":`<button class="bmBtn" title="${esc(t("bmAdd"))}">${svg("bookmark")}</button>`;
    el.innerHTML=`<div class="rp"><span>${pg}</span>${bmHtml}</div>`
      +`<div class="rtext" dir="auto">${stitchMarks(h.snippet||"",h.snippet_spans,null,null)}</div>`;
    const bm=el.querySelector(".bmBtn");
    if(bm){
      if(bmKeys.has(bmKey(rDoc,h.page_from,h.passage_id)))bm.classList.add("on");
      bm.onclick=(e)=>{
        e.stopPropagation();
        toggleBookmark(bm,{document_id:rDoc,passage_id:h.passage_id,

// Nach einem Umschalten (Vokalzeichen/Bild) nur die GELADENEN Blätter aus dem
// Cache neu darstellen – kein Server-Neuladen und keine Schleife über tausende
// Blätter. fillSheet/stitchMarks wenden den neuen Anzeige-Zustand (disp/rImg)
// an; die Position bleibt unangetastet. Fehlt ausnahmsweise der Text im Cache,
// wird nur diese eine Seite nachgeladen.
async function rerenderLoaded(){
  const box=$("#rReading");
  // Aktuelle Seite als Anker festhalten: Beim Umschalten (Vokalzeichen aus,
  // Bild an) ändert sich die Texthöhe, die Blätter darüber schrumpfen oder
  // wachsen – ohne Anker verrutschte die Leseposition um mehrere Seiten.
  const anker=rPage, vorher=sheetY(anker);
  const fehlt=[];
  // Knoten gibt es nur im Fenster – alles andere ist reiner Textspeicher.
  for(let p=rWinFrom;p<=rWinTo;p++){
    if(!sheetOf(p))continue;
    if(rPageText[p]!=null) fillSheet(p, rPageText[p], rPageSpans[p]||null);
    else fehlt.push(p);
  }
  if(fehlt.length){
    fehlt.forEach(p=>rLoaded.delete(p));
    await ensurePages(Math.min(...fehlt),Math.max(...fehlt));
  }
  measureWindow();syncSpacers();
  const nachher=sheetY(anker);
  if(vorher!=null&&nachher!=null)box.scrollTop+=(nachher-vorher);
  setCurrentPage(anker);
}

// Seitenweises Blättern per Pfeiltaste: von einem EIGENEN Zähler ausgehen, nicht
// von der scroll-abgeleiteten rPage. Sonst rechnete ein schneller zweiter Druck
// von einer noch nicht gesetzten (online: geschätzten) Zwischenseite weiter und
// sprang um viele Seiten. Nach kurzer Ruhe koppelt der Zähler wieder an rPage.
let _stepPage=null,_stepIdle=null;
function stepPage(delta){
  const basis=(_stepPage!=null)?_stepPage:rPage;
  const n=Math.min(rLast,Math.max(rFirst,basis+delta));
  _stepPage=n;
  clearTimeout(_stepIdle);
  _stepIdle=setTimeout(()=>{_stepPage=null;},500);
  gotoPage(n,false);
}
document.addEventListener("keydown",e=>{
  if(!$("#reader").classList.contains("open"))return;
  if(e.key==="Escape"){e.preventDefault();closeReader();return;}
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();stepPage(1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();stepPage(-1);}
  else if(e.key==="Home"){e.preventDefault();_stepPage=null;gotoPage(rFirst,false);}
  else if(e.key==="End"){e.preventDefault();_stepPage=null;gotoPage(rLast,false);}
});

/* ---------- "Was ist neu"-Fenster nach einem Update ---------- */
// Notizen sicher darstellen: alles maskieren, nur Listen/Absätze bilden
// Escapen und einfache Inline-Auszeichnung (**fett**) umsetzen. Die Sternchen
// überleben esc(), daher erst escapen, dann ersetzen (C-2).
function mdInline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}
function renderNotes(txt){
  const lines=String(txt||"").split(/\r?\n/);
  let html="",inList=false;
  const closeList=()=>{ if(inList){html+="</ul>";inList=false;} };
  for(const raw of lines){
    const l=raw.trim();
    const h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){                       // Markdown-Überschrift als kräftige Zeile
      closeList();
      if(h[2])html+=`<p class="newsH">${mdInline(h[2])}</p>`;
    }else if(/^[-*•]\s+/.test(l)){
      if(!inList){html+="<ul>";inList=true;}
      html+="<li>"+mdInline(l.replace(/^[-*•]\s+/,""))+"</li>";
    }else{
      closeList();
      if(l)html+="<p>"+mdInline(l)+"</p>";
    }
  }
  if(inList)html+="</ul>";
  return html||`<p>${esc(t("newsNone"))}</p>`;
}
// Zweisprachige Release-Notizen: deutscher Teil, dann Marker <!--ar-->, dann
// arabischer Teil. Zeigt den Abschnitt der aktuellen App-Sprache (Fallback auf
// den jeweils anderen). Ohne Marker (ältere Releases) wird alles gezeigt.
function notesForLang(body,l){
  const txt=String(body||"");
  const parts=txt.split(/<!--\s*ar\s*-->/i);
  if(parts.length<2)return txt.trim();
  const de=parts[0].replace(/<!--\s*de\s*-->/ig,"").trim();
  const ar=parts.slice(1).join("").replace(/<!--\s*de\s*-->/ig,"").trim();
  return ((l==="ar"?ar:de)||de||ar||"").trim();
}

}

/* Export / Import – mit sichtbarem, bleibendem Fortschrittsbalken */
function showProgress(msg){
  let el=$("#progress");
  if(!el){el=document.createElement("div");el.id="progress";
    el.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);"+
      "background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;"+
      "font-size:14px;z-index:100;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;";
    document.body.appendChild(el);}
  el.innerHTML=`<span class="spin"></span><span>${esc(msg)}</span>`;
  el.style.display="flex";
}
function hideProgress(){const el=$("#progress");if(el)el.style.display="none";}
// ---- Online-Buch in die Bibliothek übernehmen ------------------------
// Der Umfang wird vorher gezeigt, weil ein grosses Buch Minuten braucht und
// dauerhaft Platz belegt. Geschaetzt wird bewusst grob und sichtbar als
// Schaetzung ("etwa"), statt eine Genauigkeit vorzutaeuschen.
let dlBook=null;
function dlSchaetzung(info){
  const seiten=info.page_count||0, abschnitte=info.chunks||seiten*2;
  const bytes=abschnitte*1400;                    // ~1,4 kB je Abschnitt
  const block=info.block||500;
  const sekunden=Math.ceil(seiten/block)*1.2+1;   // ~1,2 s je Block
  const vektorMin=Math.round(abschnitte/75/60);   // gemessen 75 Passagen/s
  return {seiten,bytes,sekunden,vektorMin};
}
function dlDauerText(sek){
  if(sek<90) return t("dlAboutSec")(Math.max(1,Math.round(sek)));
  return t("dlAboutMin")(Math.max(1,Math.round(sek/60)));
}
function dlGroesseText(bytes){
  return bytes>=1e6?`${(bytes/1e6).toFixed(1)} MB`:`${Math.max(1,Math.round(bytes/1e3))} kB`;
}
// Ladezustand direkt am Übernehmen-Knopf: gesperrt + Spinner + Text, damit ein
// Klick nie „tot" wirkt, während die Buch-Info vom Server geholt wird.
function setAdoptLoading(on){
  const b=$("#rDownloadBook"); if(!b)return;
  if(on){
    if(b._orig==null)b._orig=b.innerHTML;
    b.disabled=true;
    b.innerHTML=`<span class="ring mini"></span>`;
  }else{
    b.disabled=false;
    if(b._orig!=null){b.innerHTML=b._orig;b._orig=null;}
  }
}
async function openDownloadDialog(){
  if(!rRemote||!rBook)return showError(t("dlNoBook"));
  setAdoptLoading(true);
  showProgress(t("dlChecking"));   // gut sichtbare Pille, nicht nur der kleine Icon-Spinner
  let info;
  try{
    info=await api().shamela_book_info({book_id:rBook,title:rTitleTxt,author:rAuthorTxt});
  }catch(err){
    setAdoptLoading(false); hideProgress();
    return showError(t("dlErrNet"));
  }
  setAdoptLoading(false); hideProgress();
  if(!info)return showError(t("dlErrNet"));
  if(info.error)return showError(info.error);
  if(info.vorhanden){
    // Schon da: lieber die lokale Fassung öffnen als ein zweites Mal laden.
    showToast(t("dlHave"));
    return;
  }
  dlBook=info;
  const s=dlSchaetzung(info);
  $("#dlBookTitle").textContent=info.title||rTitleTxt;
  $("#dlBookAuthor").textContent=info.author||rAuthorTxt||"";
  $("#dlPagesVal").textContent=s.seiten.toLocaleString();
  $("#dlSizeVal").textContent=t("dlAbout")+" "+dlGroesseText(s.bytes);
  $("#dlTimeVal").textContent=dlDauerText(s.sekunden);
  $("#dlSemantic").checked=false;
  $("#dlSemanticHint").textContent=t("dlSemanticHint")(Math.max(1,s.vektorMin));
  $("#dlOverlay").classList.add("show");
}
function closeDownloadDialog(){ $("#dlOverlay").classList.remove("show"); }
async function startDownload(){
  if(!dlBook)return;
  const body={book_id:dlBook.book_id,title:dlBook.title,author:dlBook.author,
              semantic:$("#dlSemantic").checked};
  closeDownloadDialog();
  // Sofort sichtbar, dass etwas läuft – bevor der Server-Job im Statuspoll auftaucht.
  showProgress(t("dlBookDone")+" …");
  let r;
  try{ r=await api().shamela_download(body); }
  catch(err){ hideProgress(); return showError(t("dlErrNet")); }
  if(r&&r.error){ hideProgress(); return showError(r.error); }
  trackJob("Buchübernahme",t("dlBookDone"));
}

async function trackJob(key,doneMsg){
  showProgress(doneMsg+" …");
  const poll=async()=>{const st=await api().status();const j=st.jobs.find(x=>x.file===key);
    if(!j)return setTimeout(poll,600);
    if(j.state==="fertig"){hideProgress();showToast(j.result||doneMsg);refreshDocs();}
    else if(j.state==="fehler"){hideProgress();showError(j.error||"Fehler");}
    else{showProgress(jobLabel(j));refreshDocs();setTimeout(poll,700);}};
  poll();
}
$("#exportBtn").onclick=async()=>{const r=await api().export_library();if(r&&r.error)return showError(r.error);if(r&&r.cancelled)return;trackJob("Export",t("exportDone"));};
$("#exportSelBtn").onclick=async()=>{const ids=[...selectedForExport];if(!ids.length)return showError(t("selectNone"));const r=await api().export_library(ids);if(r&&r.error)return showError(r.error);if(r&&r.cancelled)return;trackJob("Export",t("exportDone"));};
$("#delSelBtn").onclick=async()=>{
  const ids=[...selectedForExport];if(!ids.length)return showError(t("selectNone"));
  if(!await appConfirm(T[lang].confirmDeleteN(ids.length),{okText:t("del")}))return;
  const r=await api().delete_documents(ids);
  if(r&&r.error)return showError(r.error);
  selectedForExport=new Set();
  showToast(`${(r&&r.deleted)||ids.length} ${t("deletedN")}`);
  refreshDocs();
};
$("#importBtn").onclick=async()=>{const r=await api().import_library();if(r&&r.error)return showError(r.error);if(r&&r.cancelled)return;trackJob("Import",t("importDone"));};

/* ---------- Quellen-Umschalter + Shamela-Einstellungen ---------- */
let _shStatus={configured:false,url:""};
async function refreshShamelaState(){
  try{ _shStatus=await api().shamela_status(); }catch(e){ _shStatus={configured:false,url:""}; }
  const el=$("#shamelaState");
  if(el){
    if(searchSource!=="shamela"){ el.textContent=""; el.className="shamelaState"; }
    else if(_shStatus.configured){ el.textContent="● "+t("shamelaConnected"); el.className="shamelaState ok"; }
    else { el.textContent="● "+t("shamelaNotSet"); el.className="shamelaState off"; }
  }
}
// Beim Wechsel in den Shamela-Modus die Filterlisten vom Server holen.
// Kategorien gibt es in diesem Datensatz nicht – kommt eine leere Liste,
// bleibt der Kategoriefilter ausgeblendet (siehe applySourceUI).
let shHasCats=false;
async function loadShamelaFilters(){
  // Kategorien werden bewusst nicht mehr abgefragt: die Shamela-Daten
  // enthalten kein Kategorienfeld, der Server liefert deshalb immer eine
  // leere Liste. Der Aufruf war ein reiner Verbindungsaufbau für nichts,
  // und der Filter wird ohnehin ausgeblendet (siehe applySourceUI).
  shHasCats=false; fillCatSel([]);
  let okA=false, okB=false;
  try{ okA=await loadShamelaAuthors(""); }catch(e){ okA=false; }
  try{ okB=await loadShamelaBooks(""); }catch(e){ okB=false; }
  applySourceUI();
  // Wenn der Server die Filter nicht liefert: leer lassen (nicht lokal) und
  // sichtbar melden, damit klar ist, dass die Verbindung das Problem ist.
  if(!okA||!okB){ if(!okA)authorOptions=[]; if(!okB)allDocs=[]; showError(t("shamelaFilterErr")); }
}
// Bücherliste des Servers in den Buchfilter laden (Titel -> Kennung).
async function loadShamelaBooks(q){
  const r=await api().shamela_books({q:q||"",limit:200});
  if(!r||r.error)return false;
  const seen=new Set(bookFilterSel.map(b=>b.id));
  const liste=(r.books||[]).map(b=>({id:b.book_id,title:b.title,author:b.author}));
  // Bereits gewählte behalten, damit ihre Titel auflösbar bleiben.
  allDocs=bookFilterSel.filter(b=>seen.has(b.id))
    .concat(liste.filter(b=>!seen.has(b.id)));
  return true;
}
// Autorenliste des Servers in den Autorenfilter laden (durchsuchbar). Der
// Server durchsucht ALLE ~3.000 Autoren per Teilstring; ohne diesen Aufruf
// würde nur eine feste Anfangsliste lokal gefiltert.
async function loadShamelaAuthors(q){
  const a=await api().shamela_authors(q||"",200);
  if(!a||a.error)return false;
  fillAuthorSel(a.authors||[]);
  return true;
}
function applySourceUI(){
  const shamela=searchSource==="shamela";
  $$("#srcToggle .srcBtn").forEach(b=>b.classList.toggle("active",b.dataset.src===searchSource));
  // Buch- und Semantik-Schalter gibt es jetzt in beiden Modi: Online sucht
  // seit der Umstellung nach Wort und Wurzel wie offline, die Semantik kommt
  // als Ergänzung dazu (standardmäßig an).
  const semLbl=$("#semantic")&&$("#semantic").closest("label");
  if(semLbl)semLbl.style.display="";
  // Kategoriefilter nur zeigen, wenn die Quelle wirklich Kategorien liefert.
  const catLbl=$("#catSel")&&$("#catSel").closest("label");
  if(catLbl)catLbl.style.display=(shamela&&!shHasCats)?"none":"";
  // ODER-Gruppe und Ausschluss gibt es in BEIDEN Quellen. Sie waren online
  // eine Zeit lang ausgeblendet, weil die Anfrage flach zusammengesetzt wurde
  // und die Gruppen dabei verfielen. Jetzt gehen die Pillen strukturiert an den
  // Server, der daraus mit derselben Engine-Funktion wie offline sucht.
  const addGrp=$("#mAddGroup"); if(addGrp)addGrp.style.display="";
  const exclToggle=$("#mToggleExclude"); if(exclToggle)exclToggle.style.display="";
  refreshShamelaState();
}
async function setSource(src){
  if(src===searchSource)return;
  searchSource=src;
  // Filter zurücksetzen (Quellen haben unterschiedliche Autoren/Kategorien)
  authorFilterSel=[];catFilterSel=[];bookFilterSel=[];
  renderAuthorFilter();renderCatFilter();renderBookFilter();
  applySourceUI();
  if(src==="shamela"){
    // Keine lokalen Reste im Online-Modus: Options-Caches leeren, bevor der
    // Server sie füllt. Scheitert das Laden, bleiben sie leer statt lokal.
    authorOptions=[]; allDocs=[];
    await refreshShamelaState();
    if(!_shStatus.configured){ openShamelaCfg(); }
    else { await loadShamelaFilters(); }
    $("#results").innerHTML=emptyBox(_shStatus.configured?t("shamelaQueryHint"):t("shamelaNeedCfg"));
    $("#count").textContent="";
  }else{
    refreshCategorySources();refreshAuthorSources();refreshDocs();
    $("#results").innerHTML=emptyBox(t("start"));
    $("#count").textContent="";
  }
}
$$("#srcToggle .srcBtn").forEach(b=>b.onclick=()=>setSource(b.dataset.src));

/* Shamela-Einstellungen (URL + Token, einmalig) */
function openShamelaCfg(){
  $("#shamelaUrl").value=_shStatus.url||"";
  $("#shamelaToken").value="";      // Token wird nie zurückgegeben
  $("#shamelaMsg").textContent="";$("#shamelaMsg").className="shamelaMsg";
  $("#shamelaClearBtn").style.display=_shStatus.configured?"":"none";
  $("#shamelaOverlay").classList.add("show");
  setTimeout(()=>$("#shamelaUrl").focus(),50);
}
function closeShamelaCfg(){$("#shamelaOverlay").classList.remove("show");}
$("#shamelaCfgBtn").onclick=async()=>{ await refreshShamelaState(); openShamelaCfg(); };
$("#shamelaClose").onclick=closeShamelaCfg;
$("#shamelaCancel").onclick=closeShamelaCfg;
$("#shamelaOverlay").onclick=e=>{if(e.target===$("#shamelaOverlay"))closeShamelaCfg();};
$("#shamelaSave").onclick=async()=>{
  const url=$("#shamelaUrl").value.trim();
  const token=$("#shamelaToken").value.trim();
  const msg=$("#shamelaMsg");
  msg.className="shamelaMsg";msg.textContent=t("shamelaTesting");
  const r=await api().shamela_save(url,token);
  if(r&&r.ok){
    msg.className="shamelaMsg ok";
    msg.textContent=(r.points!=null)?t("shamelaOkN")(r.points):t("shamelaOk");
    await refreshShamelaState();
    if(searchSource==="shamela"){ await loadShamelaFilters();
      $("#results").innerHTML=emptyBox(t("shamelaQueryHint")); }
    setTimeout(closeShamelaCfg,900);
  }else{
    msg.className="shamelaMsg err";
    msg.textContent=(r&&r.error)||t("shamelaLoadErr");
    await refreshShamelaState();
  }
};
$("#shamelaClearBtn").onclick=async()=>{
  await api().shamela_clear();
  _shStatus={configured:false,url:""};
  $("#shamelaMsg").className="shamelaMsg";$("#shamelaMsg").textContent=t("shamelaCleared");
  $("#shamelaClearBtn").style.display="none";
  refreshShamelaState();
};

/* ---------- Start ---------- */
$("#brandIcon").innerHTML=svg("logo");
paintIcons();
(async()=>{
  try{const s=await api().settings();applyLang(s.lang==="ar"?"ar":"de");}
  catch(e){applyLang("de");}
  paintIcons();
  refreshStatus();refreshDocs();refreshCategorySources();refreshAuthorSources();
  startUpdateHeartbeat();   // Update auch ohne Neustart erkennen
  try{const v=await api().version();if(v&&v.version)$("#versionLabel").textContent="v"+v.version;}catch(e){}
  // gespeicherte Schriftgröße für den Leser übernehmen
  try{const f=await api().meta_get("font_scale");const n=parseFloat(f.value||"");
    if(n>=RFONT_MIN&&n<=RFONT_MAX){rFont=n;$("#rReading").style.setProperty("--rfont",n.toFixed(2));}}catch(e){}
  // gespeicherte Schriftart + „kräftiger" übernehmen (global: Trefferliste + Leser)
  try{const ff=await api().meta_get("reader_font");if(ff&&AR_FONTS.includes(ff.value))rFontFamily=ff.value;}catch(e){}
  try{const bd=await api().meta_get("reader_bold");rBold=(bd&&bd.value==="1");}catch(e){}
  applyArabFont(); applyBold();
  // gemerkten Tashkil-Schalter übernehmen (global)
  try{const tk=await api().meta_get("hide_tashkil");rHideTashkil=(tk.value==="1");}catch(e){}
  updateTashkilBtn();
  refreshBmKeys();     // gesetzte Lesezeichen kennen (Symbolzustand)
  applySourceUI();     // Quellen-Umschalter in Grundstellung
  refreshShamelaState();
  checkWhatsNew();     // nach einem Update die Änderungen zeigen
})();
</script>
